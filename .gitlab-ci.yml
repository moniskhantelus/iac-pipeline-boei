# Approval-gate test only. No Terraform, Azure login, apply or destroy commands.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages: [test, iac_init, iac_approval, iac_apply]

variables:
  DEPLOY_ENV:
    value: "dev"
    options: ["sandbox", "dev", "uat", "prod"]
    description: "Approval policy to test. No infrastructure is deployed."

default:
  image: registry.web.boeing.com/amp/docker-images/terraform/terraform-azure/ubi8minimal-azterraform/v1.9.2:26.04.15

include:
  - local: /templates/terraform-gate/template.yml
    inputs:
      job_name: iac_gates_job
      stage: iac_approval
      environment: $DEPLOY_ENV

approval_unit_tests:
  stage: test
  script:
    - python3 -m unittest discover -s tests -p test_gate.py -v

iac_init_job:
  stage: iac_init
  script:
    - echo "[TEST ONLY] Init placeholder; no infrastructure commands."

iac_apply_job:
  stage: iac_apply
  needs:
    - job: iac_init_job
      artifacts: false
    - job: iac_gates_job
      artifacts: true
  script:
    - |
      python3 - <<'VERIFY_GATE_PY'
      import json, os, sys
      from pathlib import Path
      try:
          decision = json.loads((Path(os.environ['CI_PROJECT_DIR']) / 'gate-decision.json').read_text())
          expected = os.environ.get('DEPLOY_ENV') or os.environ.get('TF_ENV')
          if expected not in ('sandbox', 'dev', 'uat', 'prod'):
              raise ValueError('invalid target environment')
          for key, value in [('environment', expected), ('commit_sha', os.environ['CI_COMMIT_SHA']),
                             ('pipeline_id', os.environ['CI_PIPELINE_ID']), ('outcome', 'APPROVED')]:
              if not value or decision.get(key) != value:
                  raise ValueError('gate decision mismatch: ' + key)
          required = {'sandbox': 0, 'dev': 0, 'uat': 1, 'prod': 2}[expected]
          if type(decision.get('approvals_count')) is not int or decision['approvals_count'] < required:
              raise ValueError('gate approval count below story minimum')
          if expected == 'prod' and not decision.get('change_ticket'):
              raise ValueError('production gate has no change record')
      except Exception as exc:
          print('[ERROR] Apply refused: missing or invalid approval gate evidence: ' + str(exc), file=sys.stderr)
          sys.exit(1)
      print('[INFO] Approval gate evidence verified for ' + expected)
      VERIFY_GATE_PY
    - echo "[PASS] Gate dependency and decision verified. This is a probe; no infrastructure was changed."
  allow_failure: false
