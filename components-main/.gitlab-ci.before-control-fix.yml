# Every `- local:` below is a self-test fragment that EXISTS in this repo and
# includes its component at $CI_COMMIT_SHA, so the revision under test is exactly
# this commit. A `local:` pointing at a missing file is a hard config error, so
# the list is kept in lockstep with tests/.
# =============================================================================

