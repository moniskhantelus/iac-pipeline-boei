# -----------------------------------------------------------------------------
# One-off manual cleanup utility (developer-run, STR-221 testing aid).
# Purges THIS project's leftover CI artifacts from PREVIOUS failed/old pipelines via the GitLab
# API — not the k8s runner Secrets (those live in the gitlabrunner-prod namespace and need
# cluster/kubectl access this job does not have; that cleanup is a platform task, see
# jira-comments/str-221). This reclaims GitLab-side storage left by failed deployment runs so a
# developer can keep iterating on the branch without accumulating stale artifacts.
#
# Manual-only (never auto-runs). Uses CLEANUP_TOKEN (a masked/protected PAT with api scope, set as
# a CI/CD variable) rather than CI_JOB_TOKEN, because artifact deletion needs api scope. If
# CLEANUP_TOKEN is absent the job explains what to set and exits 0 (no-op) so it is safe to click.
# -----------------------------------------------------------------------------
cleanup-stale-artifacts:
  stage: test
  image: registry.web.boeing.com/ecs-catalog/docker-images/curl-jq/v1:latest   # TODO(pair): pin
  rules:
    - when: manual
      allow_failure: true
  variables:
    KEEP_RECENT: "5"   # keep the N most-recent pipelines' artifacts; purge older ones
  script:
    - set -euo pipefail
    - |
      if [ -z "${CLEANUP_TOKEN:-}" ]; then
        echo "[INFO] CLEANUP_TOKEN not set — this is a no-op."
        echo "[INFO] To use: add a masked/protected CI/CD variable CLEANUP_TOKEN (PAT, api scope),"
        echo "[INFO] then re-run this manual job. It purges artifacts from older pipelines on this project."
        exit 0
      fi
    - |
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      echo "[INFO] Listing pipelines for ${CI_PROJECT_PATH} (keeping ${KEEP_RECENT} most recent)..."
      # Pipelines newest-first; skip the KEEP_RECENT newest, delete artifacts for the rest.
      IDS=$(curl --silent --fail --header "PRIVATE-TOKEN: ${CLEANUP_TOKEN}" \
        "${API}/pipelines?order_by=id&sort=desc&per_page=100" \
        | jq -r ".[${KEEP_RECENT}:][].id") || { echo "[ERROR] could not list pipelines (token scope?)"; exit 1; }
      if [ -z "${IDS}" ]; then echo "[INFO] Nothing to purge."; exit 0; fi
      for pid in ${IDS}; do
        echo "[INFO] Deleting artifacts for pipeline ${pid}..."
        curl --silent --fail --request DELETE --header "PRIVATE-TOKEN: ${CLEANUP_TOKEN}" \
          "${API}/pipelines/${pid}/artifacts" \
          && echo "  [OK] ${pid}" || echo "  [WARN] could not delete artifacts for ${pid} (may already be expired)"
      done
      echo "[INFO] Artifact cleanup complete."

# -----------------------------------------------------------------------------
# Release [STR-221]: the `create-release` job comes from the shared company component
# components/gitlab/release (see include: above). This block only overrides its rules.
#
# The component's default rule makes the job MANUAL on ANY tag. We keep our original behaviour:
# auto-run, and only for a semantic-version tag (replaces the old `$CI_COMMIT_TAG -> when: never`
# anti-pattern that blocked all publishing).
#
# History of the hand-rolled job this replaces:
#   1. ecs-catalog/.../glab-cli/v1:latest  -> pull denied (ecs-catalog entitlement gap).
#   2. amp/.../ubi8minimal-azterraform     -> "release-cli: command not found" (no release tooling).
#   3. sres.web.boeing.com:5050/gitlab/glab -> pull denied to anonymous; fixed with SRES
#      DOCKER_AUTH_CONFIG (pipeline #12616640), but the tag pipeline (#12616830, job 52097541) then
#      failed at step_release: "x509: certificate signed by unknown authority" calling the
#      git.web.boeing.com API — the public glab image does not trust the Boeing CA.
#   4. components/gitlab/release (Boeing-built glab image, Boeing CA trusted, no SRES creds).
#      Proven by components/gitlab's own 0.6.1 release (job 48956714) on the same OCP runner fleet.
# -----------------------------------------------------------------------------
create-release:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
