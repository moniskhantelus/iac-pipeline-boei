# -----------------------------------------------------------------------------
# Pipeline triggering (new `components` repo, 0.x dev stage).
# This repo auto-runs a pipeline on branch pushes, MRs, tags, scheduled runs, and manual
# "Run pipeline". The branch-push rule (`$CI_COMMIT_BRANCH`) is what kick-starts CI for ongoing
# dev work in this repo.
#
# HISTORY: the former POC repo (`kaas/pipelines/strata-components`) intentionally OMITTED the
# `$CI_COMMIT_BRANCH` rule to avoid dispatching jobs to the saturated `gitlabrunner-prod` runner
# (Secrets quota 125/125 — STR-221). With no matching workflow rule, GitLab created no pipeline on
# push, which is why pushes appeared to "do nothing". That suppression was POC-specific and is
# lifted here so dev pushes run automatically.
#
# If this repo's runner is still quota-constrained and branch pushes start failing at
# "Preparing environment: exceeded quota ... secrets", comment out the `$CI_COMMIT_BRANCH` rule
# again and trigger via Pipelines → Run pipeline (the `web` rule) until the platform team confirms
# headroom.
# -----------------------------------------------------------------------------
workflow:
  rules:
    - if: '$CI_COMMIT_TAG'                                 # releases always allowed
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'  # MRs allowed
    - if: '$CI_PIPELINE_SOURCE == "web"'                  # manual "Run pipeline" allowed
    - if: '$CI_PIPELINE_SOURCE == "schedule"'             # scheduled (e.g. drift) allowed
    - if: '$CI_COMMIT_BRANCH'                             # branch pushes auto-run (kick-starts dev CI)

# -----------------------------------------------------------------------------
# Secret scanning (CI) — hand-rolled gitleaks gate. [STR-226]
# TEMP replacement for the shared `secret-detection@1` component, which is broken on our runner
# (it runs the gitleaks image with GitLab's injected `sh`, but the image ENTRYPOINT is `gitleaks`,
# producing `Error: unknown command "sh" for "gitleaks"`).
#
# Fix here: `entrypoint: [""]` clears the image ENTRYPOINT so GitLab's shell runs our `script:`
# normally and we invoke `gitleaks` ourselves. We scan the working directory with the repo-local
# .gitleaks.toml (default rules + Azure/Terraform rules: client_secret, ARM_CLIENT_SECRET, storage
# keys). This is a BLOCKING security gate: gitleaks exits non-zero on any finding, failing the job
# (no allow_failure). Re-adopt the shared component once it no longer overrides the entrypoint.
# -----------------------------------------------------------------------------
secret_detection:
  stage: secret_detection
  image:
    name: registry.web.boeing.com/containers/linux/gitleaks:v8.21.0
    entrypoint: [""]
  script:
    - gitleaks version
    # `gitleaks dir` scans the checked-out source tree. --redact keeps secret values out of logs;
    # a non-zero exit on findings fails this job and blocks the pipeline (the intended gate).
    - gitleaks dir . --config .gitleaks.toml --no-banner --redact --verbose

