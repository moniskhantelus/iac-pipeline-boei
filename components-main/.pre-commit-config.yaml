# =============================================================================
# Pre-commit hooks for kaas/pipelines/components
# -----------------------------------------------------------------------------
# Story  : STR-226 (extended from iac_module_pipeline to components)
# Purpose: First line of defense — block secrets the moment they are staged,
#          before they enter Git history. The CI gitleaks job in
#          .gitlab-ci.yml is the server-side safety net.
#
# Setup (two commands):
#   pip install pre-commit
#   pre-commit install
#
# Gitleaks is pinned so hook behavior does not change silently. It runs with
# the repo-local .gitleaks.toml, which keeps all default rules AND adds
# Azure/Terraform secret rules (client_secret, ARM_CLIENT_SECRET, storage keys).
# =============================================================================
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4                       # pinned - do not float
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (gitleaks)
        # Uses .gitleaks.toml in the repo root automatically.
