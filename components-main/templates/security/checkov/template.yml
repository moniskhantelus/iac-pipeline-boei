spec:
  inputs:
    job_name:
      description: "CI job name."
      default: checkov
    stage:
      description: "Stage this job runs in."
      default: policy
    scan_dir:
      description: "Directory to scan, relative to the repo root."
      default: "."
    skip_path:
      description: "Comma-separated paths to skip (e.g. examples)."
      default: "examples"
    frameworks:
      description: "Checkov frameworks to scan."
      default: "terraform cloudformation kubernetes dockerfile"
    treat_null_severity_as_blocking:
      description: "Route findings with null/unknown severity into the blocking bucket (fail-safe)."
      default: "true"
    checkov_image:
      description: "Boeing-internal Checkov image."
      default: "registry.web.boeing.com/ecs-catalog/docker-images/checkov/v3.2"
    checkov_image_version:
      description: "Tag of the Checkov image (pinned — never latest)."
      default: "0.9.0"
---

"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: "$[[ inputs.checkov_image ]]:$[[ inputs.checkov_image_version ]]"
  variables:
    SCAN_DIR: "$[[ inputs.scan_dir ]]"
    SKIP_PATH: "$[[ inputs.skip_path ]]"
    FRAMEWORKS: "$[[ inputs.frameworks ]]"
    NULL_BLOCKS: "$[[ inputs.treat_null_severity_as_blocking ]]"
  script:
    - set -euo pipefail
    - mkdir -p reports
    # Human-readable console output (informational; does not decide pass/fail).
    - |
      checkov --directory "${SCAN_DIR}" --skip-path "${SKIP_PATH}" \
        --output cli --framework ${FRAMEWORKS} --compact --soft-fail \
        --download-external-modules true || true
    # Machine-readable JSON for the gate decision. Soft-fail here so we read the file ourselves.
    - |
      checkov --directory "${SCAN_DIR}" --skip-path "${SKIP_PATH}" \
        --output json --output-file-path reports/checkov-json \
        --framework ${FRAMEWORKS} --compact --soft-fail \
        --download-external-modules true > /dev/null 2>&1 || true
      [ -f reports/checkov-json/results_json.json ] && mv reports/checkov-json/results_json.json reports/checkov-report.json
    - |
      checkov --directory "${SCAN_DIR}" --skip-path "${SKIP_PATH}" \
        --output junitxml --output-file-path reports/checkov-xml \
        --framework ${FRAMEWORKS} --compact --soft-fail \
        --download-external-modules true > /dev/null 2>&1 || true
      [ -f reports/checkov-xml/results_junitxml.xml ] && mv reports/checkov-xml/results_junitxml.xml reports/checkov-report-junit.xml
    # --- Gate decision: HIGH/CRITICAL block; null severity blocks when NULL_BLOCKS=true ---
    - |
      if ! command -v jq >/dev/null; then echo "[ERROR] jq missing — cannot evaluate findings; failing closed"; exit 1; fi
      REPORT=reports/checkov-report.json
      if [ ! -f "${REPORT}" ]; then echo "[ERROR] Checkov report not produced — failing closed"; exit 1; fi

      if [ "${NULL_BLOCKS}" = "true" ]; then
        BLOCKING=$(jq '[.results.failed_checks // []] | flatten
          | [.[] | select(.severity=="HIGH" or .severity=="CRITICAL" or .severity==null)] | length' "${REPORT}")
      else
        BLOCKING=$(jq '[.results.failed_checks // []] | flatten
          | [.[] | select(.severity=="HIGH" or .severity=="CRITICAL")] | length' "${REPORT}")
      fi
      WARN=$(jq '[.results.failed_checks // []] | flatten
        | [.[] | select(.severity=="LOW" or .severity=="MEDIUM")] | length' "${REPORT}")

      echo "[INFO] Checkov blocking findings: ${BLOCKING}; warnings (LOW/MEDIUM): ${WARN}"
      if [ "${BLOCKING}" -gt 0 ]; then
        echo "[ERROR] Checkov found ${BLOCKING} blocking finding(s) — job failed"
        jq -r '[.results.failed_checks // []] | flatten | .[]
          | select(.severity=="HIGH" or .severity=="CRITICAL" or .severity==null)
          | "  - [\(.severity // "UNKNOWN")] \(.check_id) \(.resource) (\(.file_path))"' "${REPORT}"
        exit 1
      fi
      echo "[INFO] No blocking findings."
  artifacts:
    paths:
      - reports/checkov-report.json
      - reports/checkov-report-junit.xml
    reports:
      junit: reports/checkov-report-junit.xml
    when: always
  allow_failure: false
