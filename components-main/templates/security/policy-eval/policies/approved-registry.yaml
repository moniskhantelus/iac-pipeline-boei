apiVersion: kaas.boeing/policy-eval/v1
kind: Policy
metadata:
  name: approved-registry
spec:
  # Starts in Audit so teams migrating from Tanzu are not hard-blocked on day one.
  mode: Audit
  target: kubernetes
  rules:
    - name: image-from-approved-acr
      match:
        kinds: [Deployment, StatefulSet, DaemonSet]
      validate:
        message: "Container images must come from an approved ACR (azurecr.us)."
        foreach:
          list: spec.template.spec.containers
          pattern:
            image: "*azurecr.us*"
