apiVersion: kaas.boeing/policy-eval/v1
kind: Policy
metadata:
  name: cluster-secret-store-only
spec:
  mode: Enforce
  target: kubernetes
  rules:
    - name: externalsecret-must-reference-clustersecretstore
      match:
        kinds: [ExternalSecret]
      validate:
        message: "ExternalSecret must reference a ClusterSecretStore (namespace-scoped SecretStore is forbidden)."
        pattern:
          spec:
            secretStoreRef:
              kind: ClusterSecretStore
    - name: deny-namespaced-secretstore
      match:
        kinds: [SecretStore]
      validate:
        message: "Namespace-scoped SecretStore creation is blocked; use ClusterSecretStore."
        deny:
          conditions:
            - key: kind
              operator: Equals
              value: SecretStore
