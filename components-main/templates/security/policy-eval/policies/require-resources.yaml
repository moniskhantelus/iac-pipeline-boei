apiVersion: kaas.boeing/policy-eval/v1   # maps to kyverno.io/v1 ClusterPolicy later
kind: Policy
metadata:
  name: require-resources
spec:
  mode: Enforce
  target: kubernetes
  rules:
    - name: require-cpu-mem-requests-limits
      match:
        kinds: [Deployment, StatefulSet, DaemonSet, Job, CronJob]
      validate:
        message: "All containers must set CPU/memory requests and limits."
        foreach:
          list: spec.template.spec.containers
          pattern:
            resources:
              requests:
                cpu: "?*"
                memory: "?*"
              limits:
                cpu: "?*"
                memory: "?*"
