spec:
  inputs:
    job_name:
      description: "CI job name."
      default: policy-eval
    stage:
      description: "Stage this job runs in."
      default: policy
    target:
      description: "What to evaluate: kubernetes (manifests) or tfplan (terraform plan JSON)."
      default: kubernetes
    manifest_dir:
      description: "Directory of Kubernetes manifests (target=kubernetes)."
      default: "k8s"
    tfplan_json:
      description: "Path to terraform plan JSON (target=tfplan)."
      default: "plan.tfplan.json"
    policy_dir:
      description: "Local directory of policy YAML. Used when policy_repo is empty."
      default: "policies"
    policy_repo:
      description: "Optional policy repo to clone instead of using a local policy_dir."
      default: ""
    policy_ref:
      description: "Pinned ref of policy_repo (used only when policy_repo is set)."
      default: "v1.0.0"
    use_builtin_policies:
      description: "If true, use the seeded policy set shipped with this component revision."
      default: "false"
    policy_image:
      description: "Boeing-internal image with python3 + pyyaml + git."
      default: "registry.web.boeing.com/ecs-catalog/docker-images/python/v3.12"
    policy_image_version:
      description: "Pinned tag."
      default: "1.0.0"
  component:
    - name
    - version
    - sha
---

"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: "$[[ inputs.policy_image ]]:$[[ inputs.policy_image_version ]]"
  variables:
    TARGET: "$[[ inputs.target ]]"
    MANIFEST_DIR: "$[[ inputs.manifest_dir ]]"
    TFPLAN_JSON: "$[[ inputs.tfplan_json ]]"
    POLICY_DIR: "$[[ inputs.policy_dir ]]"
    POLICY_REPO: "$[[ inputs.policy_repo ]]"
    POLICY_REF: "$[[ inputs.policy_ref ]]"
    USE_BUILTIN: "$[[ inputs.use_builtin_policies ]]"
  script:
    - set -euo pipefail
    - python3 --version
    - python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
    # --- Obtain the policy engine ------------------------------------------------------------
    # Prefer the copy already in the checked-out repo; otherwise fetch over the API at the current
    # commit. Avoids the component-sha interpolation (valid only for catalog includes; errors under local).
    - |
      ENGINE_SRC="templates/security/policy-eval/policy_eval.py"
      if [ -f "${ENGINE_SRC}" ]; then
        echo "[INFO] Using engine from checked-out repo: ${ENGINE_SRC}"
        cp "${ENGINE_SRC}" policy_eval.py
      else
        ENGINE_URL="${CI_API_V4_URL}/projects/kaas%2Fpipelines%2Fcomponents/repository/files/templates%2Fsecurity%2Fpolicy-eval%2Fpolicy_eval.py/raw?ref=${CI_COMMIT_SHA}"
        echo "[INFO] Fetching engine at ${CI_COMMIT_SHA}: ${ENGINE_URL}"
        curl --silent --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${ENGINE_URL}" -o policy_eval.py \
          || { echo "[ERROR] Could not obtain policy_eval.py (no local copy, API fetch failed)." >&2; exit 2; }
      fi
    # --- Resolve the policy set ---
    - |
      if [ "${USE_BUILTIN}" = "true" ]; then
        echo "[INFO] Using the seeded policy set shipped with this component"
        mkdir -p .builtin-policies
        SEED_DIR="templates/security/policy-eval/policies"
        BASE="${CI_API_V4_URL}/projects/kaas%2Fpipelines%2Fcomponents/repository/files"
        for p in require-resources require-nonroot require-labels approved-registry no-mutable-tag cluster-secret-store-only approved-regions naming-convention no-public-aks storage-soft-delete-versioning keyvault-purge-protection min-tls-12; do
          # Prefer the policy file from the checked-out repo; otherwise fetch at the current commit.
          if [ -f "${SEED_DIR}/${p}.yaml" ]; then
            cp "${SEED_DIR}/${p}.yaml" ".builtin-policies/${p}.yaml"
          else
            enc="templates%2Fsecurity%2Fpolicy-eval%2Fpolicies%2F${p}.yaml"
            curl --silent --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${BASE}/${enc}/raw?ref=${CI_COMMIT_SHA}" \
              -o ".builtin-policies/${p}.yaml" || echo "[WARN] seeded policy ${p} not fetched"
          fi
        done
        POLICY_DIR=".builtin-policies"
      elif [ -n "${POLICY_REPO}" ]; then
        echo "[INFO] Cloning policy repo ${POLICY_REPO}@${POLICY_REF}"
        git clone --depth 1 --branch "${POLICY_REF}" \
          "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${POLICY_REPO}.git" .remote-policies
        POLICY_DIR=".remote-policies"
      fi
      echo "[INFO] Policy dir: ${POLICY_DIR}"
    # --- Evaluate ---
    - |
      if [ "${TARGET}" = "tfplan" ]; then
        python3 policy_eval.py --policy-dir "${POLICY_DIR}" --target tfplan --tfplan-json "${TFPLAN_JSON}" --report-dir reports
      else
        python3 policy_eval.py --policy-dir "${POLICY_DIR}" --target kubernetes --manifest-dir "${MANIFEST_DIR}" --report-dir reports
      fi
  artifacts:
    paths:
      - reports/policy-eval-report.json
    reports:
      junit: reports/policy-eval-junit.xml
    when: always
  allow_failure: false
