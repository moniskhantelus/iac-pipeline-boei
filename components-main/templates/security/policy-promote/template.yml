spec:
  inputs:
    job_name:
      description: "CI job name."
      default: policy-promote
    stage:
      description: "Stage this job runs in."
      default: promote
    policy_name:
      description: "Name of the ClusterPolicy / constraint to promote."
      # required
    target_env:
      description: "Environment overlay to update (dev|staging|prod)."
      # required
    action:
      description: "Target enforcement action (Audit or Enforce)."
      # required
    gitops_repo:
      description: "Platform GitOps repo path (policy overlays live here)."
      default: "kaas/platform/platform-gitops"
    gitops_branch_prefix:
      description: "Branch prefix for the promotion MR."
      default: "policy-promote"
    dry_run:
      description: "If true, prepare the change but do not push/MR (self-test)."
      default: "false"
    tools_image:
      description: "Boeing-internal image with git, glab, yq."
      default: "registry.web.boeing.com/ecs-catalog/docker-images/gitops-tools/v1"
    tools_image_version:
      description: "Pinned tag."
      default: "1.0.0"
  component:
    - name
---

"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: "$[[ inputs.tools_image ]]:$[[ inputs.tools_image_version ]]"
  variables:
    POLICY_NAME: "$[[ inputs.policy_name ]]"
    TARGET_ENV: "$[[ inputs.target_env ]]"
    ACTION: "$[[ inputs.action ]]"
    GITOPS_REPO: "$[[ inputs.gitops_repo ]]"
    BRANCH_PREFIX: "$[[ inputs.gitops_branch_prefix ]]"
    DRY_RUN: "$[[ inputs.dry_run ]]"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - set -euo pipefail
    - |
      case "${ACTION}" in Audit|Enforce) ;; *) echo "[ERROR] action must be Audit or Enforce"; exit 1;; esac
    # GITOPS_DEPLOY_KEY is a protected CI variable (SSH deploy key scoped to the gitops repo).
    - |
      mkdir -p ~/.ssh && echo "${GITOPS_DEPLOY_KEY}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
      ssh-keyscan -H "${CI_SERVER_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
    - git clone "git@${CI_SERVER_HOST}:${GITOPS_REPO}.git" gitops
    - cd gitops
    - BRANCH="${BRANCH_PREFIX}/${POLICY_NAME}-${TARGET_ENV}-${ACTION}-${CI_PIPELINE_ID}"
    - git checkout -b "${BRANCH}"
    - FILE="platform-services/policy/overlays/${TARGET_ENV}/${POLICY_NAME}.yaml"
    - |
      if [ ! -f "${FILE}" ]; then echo "[ERROR] overlay not found: ${FILE}" >&2; exit 1; fi
      yq -i ".spec.validationFailureAction = \"${ACTION}\"" "${FILE}"
      echo "[INFO] Set ${POLICY_NAME} -> ${ACTION} in ${TARGET_ENV}"
      git --no-pager diff
    - |
      if [ "${DRY_RUN}" = "true" ]; then echo "[INFO] dry-run: not pushing"; exit 0; fi
      git add "${FILE}"
      git commit -m "policy(${TARGET_ENV}): ${POLICY_NAME} -> ${ACTION} [pipeline ${CI_PIPELINE_ID}]"
      git push origin "${BRANCH}"
      glab mr create --source-branch "${BRANCH}" --target-branch main \
        --title "Promote ${POLICY_NAME} to ${ACTION} (${TARGET_ENV})" \
        --description "Lifecycle transition for ${POLICY_NAME} in ${TARGET_ENV}. Pipeline: ${CI_PIPELINE_URL}"
  allow_failure: false
