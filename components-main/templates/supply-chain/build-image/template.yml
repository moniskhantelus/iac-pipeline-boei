spec:
  inputs:
    job_name:
      description: "CI job name."
      default: build-image
    stage:
      description: "Stage this job runs in."
      default: build
    dockerfile:
      description: "Path to the Dockerfile, relative to the build context."
      default: "Dockerfile"
    context:
      description: "Build context directory."
      default: "."
    team:
      description: "Team id (ACR repository namespace)."
      # required
    app:
      description: "Application name (ACR repository name)."
      # required
    registry_url:
      description: "Target registry host (per-cloud). Azure Gov example: kaasappacr.azurecr.us"
      default: "kaasappacr.azurecr.us"
    base_image_registry:
      description: "Approved pre-qualified base image registry. Dockerfile FROM must match."
      default: "kaasbaseacr.azurecr.us"
    buildah_image:
      description: "Boeing-internal Buildah image."
      default: "registry.web.boeing.com/ecs-catalog/docker-images/buildah/v1"
    buildah_image_version:
      description: "Pinned Buildah image tag."
      default: "1.35.0"
  component:
    - name
    - version
---

"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: "$[[ inputs.buildah_image ]]:$[[ inputs.buildah_image_version ]]"
  variables:
    DOCKERFILE: "$[[ inputs.dockerfile ]]"
    CONTEXT: "$[[ inputs.context ]]"
    TEAM: "$[[ inputs.team ]]"
    APP: "$[[ inputs.app ]]"
    REGISTRY_URL: "$[[ inputs.registry_url ]]"
    BASE_IMAGE_REGISTRY: "$[[ inputs.base_image_registry ]]"
    STORAGE_DRIVER: "vfs"
    BUILDAH_ISOLATION: "chroot"
  script:
    - set -euo pipefail
    - |
      if [ -n "${ARM_CLIENT_SECRET:-}" ]; then
        echo "[ERROR] ARM_CLIENT_SECRET is set. Static credentials are prohibited." >&2; exit 1
      fi
    # --- Enforce approved base image ---
    - |
      FROM_LINE=$(grep -iE '^\s*FROM\s' "${CONTEXT}/${DOCKERFILE}" | head -n1)
      echo "[INFO] Base image line: ${FROM_LINE}"
      if ! echo "${FROM_LINE}" | grep -q "${BASE_IMAGE_REGISTRY}"; then
        echo "[ERROR] Dockerfile FROM must use the approved base registry ${BASE_IMAGE_REGISTRY}." >&2
        echo "        Found: ${FROM_LINE}" >&2
        exit 1
      fi
    # --- Managed Identity login to ACR (no static secret) ---
    - az login --identity --output none
    - az acr login --name "${REGISTRY_URL%%.*}"
    # --- Rootless build; tag transiently, then resolve the digest after push ---
    - IMG="${REGISTRY_URL}/${TEAM}/${APP}"
    - buildah --storage-driver "${STORAGE_DRIVER}" bud --isolation "${BUILDAH_ISOLATION}" --format oci -f "${CONTEXT}/${DOCKERFILE}" -t "${IMG}:${CI_COMMIT_SHORT_SHA}" "${CONTEXT}"
    - buildah --storage-driver "${STORAGE_DRIVER}" push "${IMG}:${CI_COMMIT_SHORT_SHA}"
    # --- Capture the immutable digest for downstream jobs ---
    - DIGEST=$(skopeo inspect "docker://${IMG}:${CI_COMMIT_SHORT_SHA}" | jq -r '.Digest')
    - echo "IMAGE_REF=${IMG}@${DIGEST}" | tee image.env
    - echo "IMAGE_REPO=${IMG}" >> image.env
    - echo "IMAGE_DIGEST=${DIGEST}" >> image.env
    - 'echo "[INFO] Built and pushed ${IMG}@${DIGEST}"'
  artifacts:
    reports:
      dotenv: image.env
    paths: [image.env]
    expire_in: 7 days
  allow_failure: false
