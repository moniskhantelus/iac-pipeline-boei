spec:
  inputs:
    job_name:
      description: "CI job name."
      default: scan-image
    stage:
      description: "Stage this job runs in."
      default: scan
    scan_tool:
      description: "Scanner mode: trivy (default), prisma (twist-cli), or twistlock-shared (read the company components/twistlock-scan report; this component only gates + routes CAIRO)."
      default: trivy
    image_ref:
      description: "Full image reference (repo@sha256:digest). Default consumes build-image dotenv."
      default: "$IMAGE_REF"
    build_job:
      description: "Name of the build-image job (for needs/dotenv)."
      default: build-image
    shared_scan_job:
      description: "When scan_tool=twistlock-shared, the company scan job name whose report we read."
      default: twistlock-scan
    shared_report_path:
      description: "Path to the shared scanner's JSON report artifact (twistlock-shared mode)."
      default: "twistlock-report.json"
    high_waiver:
      description: "Allow High findings to pass with a tracked waiver (Critical always blocks)."
      default: "false"
    esat_id:
      description: "Boeing ESAT ID for CAIRO routing."
      # required
    app_id:
      description: "Application ID for CAIRO routing."
      # required
    support_group:
      description: "Owning support group for CAIRO routing."
      # required
    namespace:
      description: "Target namespace (CAIRO metadata)."
      default: "unknown"
    environment:
      description: "Target environment (CAIRO metadata)."
      default: "dev"
    cairo_endpoint:
      description: "CAIRO submission endpoint. Empty = write payload artifact only."
      default: ""
    trivy_image:
      description: "Boeing-internal Trivy image."
      default: "registry.web.boeing.com/ecs-catalog/docker-images/trivy/v0"
    trivy_image_version:
      description: "Pinned Trivy tag."
      default: "0.53.0"
  component:
    - name
    - version
---

"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: "$[[ inputs.trivy_image ]]:$[[ inputs.trivy_image_version ]]"
  needs:
    - job: "$[[ inputs.build_job ]]"
      artifacts: true
    # When wrapping the company scanner, also depend on its job for the report artifact.
    - job: "$[[ inputs.shared_scan_job ]]"
      artifacts: true
      optional: true
  variables:
    SCAN_TOOL: "$[[ inputs.scan_tool ]]"
    IMAGE_REF: "$[[ inputs.image_ref ]]"
    SHARED_REPORT: "$[[ inputs.shared_report_path ]]"
    HIGH_WAIVER: "$[[ inputs.high_waiver ]]"
    ESAT_ID: "$[[ inputs.esat_id ]]"
    APP_ID: "$[[ inputs.app_id ]]"
    SUPPORT_GROUP: "$[[ inputs.support_group ]]"
    NS: "$[[ inputs.namespace ]]"
    ENVIRONMENT: "$[[ inputs.environment ]]"
    CAIRO_ENDPOINT: "$[[ inputs.cairo_endpoint ]]"
  script:
    - set -euo pipefail
    - |
      if [ -z "${IMAGE_REF:-}" ]; then echo "[ERROR] IMAGE_REF empty. Did build-image run?" >&2; exit 1; fi
      echo "[INFO] Scan mode: ${SCAN_TOOL} on ${IMAGE_REF}"
    - az login --identity --output none
    # --- Produce / obtain a findings report ---
    - |
      case "${SCAN_TOOL}" in
        trivy)
          az acr login --name "$(echo "${IMAGE_REF}" | cut -d/ -f1 | cut -d. -f1)"
          trivy image --format json --output scan-report.json "${IMAGE_REF}"
          trivy image --format template --template '@/contrib/gitlab.tpl' --output gl-container-scanning.json "${IMAGE_REF}" || true
          CRIT=$(jq '[.Results[].Vulnerabilities // [] | .[] | select(.Severity=="CRITICAL")] | length' scan-report.json)
          HIGH=$(jq '[.Results[].Vulnerabilities // [] | .[] | select(.Severity=="HIGH")] | length' scan-report.json)
          ;;
        prisma)
          # twist-cli direct (Managed Identity / scoped token)
          twistcli images scan --details --output-file scan-report.json "${IMAGE_REF}"
          CRIT=$(jq '[.results[].vulnerabilities // [] | .[] | select(.severity=="critical")] | length' scan-report.json)
          HIGH=$(jq '[.results[].vulnerabilities // [] | .[] | select(.severity=="high")] | length' scan-report.json)
          ;;
        twistlock-shared)
          # Do NOT run a scanner. Read the company components/twistlock-scan report artifact.
          if [ ! -f "${SHARED_REPORT}" ]; then
            echo "[ERROR] Shared report ${SHARED_REPORT} not found. Ensure components/twistlock-scan ran as job '${shared_scan_job:-twistlock-scan}' and exposes its JSON artifact." >&2
            exit 1
          fi
          cp "${SHARED_REPORT}" scan-report.json
          # TODO(pair): confirm the shared report JSON shape; the jq paths below assume Twistlock's standard schema.
          CRIT=$(jq '[.results[].vulnerabilities // [] | .[] | select(.severity=="critical")] | length' scan-report.json)
          HIGH=$(jq '[.results[].vulnerabilities // [] | .[] | select(.severity=="high")] | length' scan-report.json)
          ;;
        *) echo "[ERROR] unknown scan_tool '${SCAN_TOOL}'"; exit 1 ;;
      esac
      echo "[INFO] Findings — Critical: ${CRIT}, High: ${HIGH}"
    # --- CAIRO routing (always submit findings with owner metadata) ---
    - |
      cat > cairo-payload.json <<EOF
      {
        "esatId": "${ESAT_ID}",
        "applicationId": "${APP_ID}",
        "namespace": "${NS}",
        "environment": "${ENVIRONMENT}",
        "supportGroup": "${SUPPORT_GROUP}",
        "image": "${IMAGE_REF}",
        "critical": ${CRIT},
        "high": ${HIGH},
        "pipeline": "${CI_PIPELINE_URL}"
      }
      EOF
      if [ -n "${CAIRO_ENDPOINT}" ]; then
        TOKEN=$(az account get-access-token --query accessToken -o tsv)
        curl --silent --fail -X POST -H "Authorization: Bearer ${TOKEN}" \
          -H 'Content-Type: application/json' -d @cairo-payload.json "${CAIRO_ENDPOINT}" \
          && echo "[INFO] CAIRO submission accepted" || echo "[WARN] CAIRO submission failed (payload retained as artifact)"
      else
        echo "[INFO] No CAIRO endpoint configured; payload retained as artifact for this environment."
      fi
    # --- Gate ---
    - |
      if [ "${CRIT}" -gt 0 ]; then
        echo "[ERROR] ${CRIT} Critical CVE(s) — blocking push/sign."; exit 1
      fi
      if [ "${HIGH}" -gt 0 ] && [ "${HIGH_WAIVER}" != "true" ]; then
        echo "[ERROR] ${HIGH} High CVE(s) — blocking (set high_waiver:true only with a tracked waiver)."; exit 1
      fi
      echo "[INFO] Scan gate passed."
  artifacts:
    paths: [scan-report.json, cairo-payload.json]
    reports:
      container_scanning: gl-container-scanning.json
    when: always
  allow_failure: false
