spec:
  inputs:
    job_name:
      description: "CI job name."
      default: tf-test
    stage:
      description: "Stage this job runs in."
      default: test
    tf_root:
      description: "Path to the Terraform root under test, relative to the repo root."
      default: "."
    spec_file:
      description: "Assertion spec filename, relative to tf_root."
      default: "tftest.yaml"
    mode:
      description: "Read-only plan assertions. Provision/teardown through the audited plan/gate/apply/destroy components."
      default: "plan"
      options: [plan]
    environment:
      description: "Compatibility input; mutation must use the controlled components."
      default: "test"
    terraform_image:
      description: "Boeing-internal image bundling Terraform + Python 3."
      default: "registry.web.boeing.com/amp/docker-images/terraform/terraform-azure/ubi8minimal-azterraform/v1.9.2"
    terraform_image_version:
      description: "Tag of the Terraform+Python image."
      default: "26.04.15"
    arm_environment:
      description: "Compatibility input; this test job does not authenticate for mutation."
      default: "AzureUSGovernment"
  component:
    - name
    - version
    - sha
---

"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: "$[[ inputs.terraform_image ]]:$[[ inputs.terraform_image_version ]]"
  variables:
    # STR-299 (Rec 5 — harden credentials / control toolchain): disabling Git TLS verification is a
    # man-in-the-middle risk and was flagged for removal. The Boeing-internal Terraform image already
    # trusts the corporate CA, so clone/fetch over HTTPS verifies normally. Do NOT re-enable the
    # bypass; if a specific internal host is untrusted, install its CA cert rather than turning
    # verification off globally.
    # GIT_SSL_NO_VERIFY: "true"   # REMOVED (STR-299 Rec 5) — do not reinstate
    GIT_SSL_NO_VERIFY: "false"
    TF_ROOT: "$[[ inputs.tf_root ]]"
    SPEC_FILE: "$[[ inputs.spec_file ]]"
    TEST_MODE: "$[[ inputs.mode ]]"
    TF_ENV: "$[[ inputs.environment ]]"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH'
      when: on_success
  script:
    - set -euo pipefail
    # --- Obtain the runner script ------------------------------------------------------------
    # Prefer the copy already in the checked-out repo (present for THIS repo's self-test and for
    # any consumer that vendors the template path); otherwise fetch it over the API at the current
    # commit. This avoids the component-sha interpolation, which is only valid for catalog
    # includes and errors under a local include (STR-299 self-test on an unregistered branch).
    - |
      SRC="templates/terraform/test/tf_test.py"
      if [ -f "${SRC}" ]; then
        echo "[INFO] Using runner from checked-out repo: ${SRC}"
        cp "${SRC}" tf_test.py
      else
        RUNNER_URL="${CI_API_V4_URL}/projects/kaas%2Fpipelines%2Fcomponents/repository/files/templates%2Fterraform%2Ftest%2Ftf_test.py/raw?ref=${CI_COMMIT_SHA}"
        echo "[INFO] Fetching runner at ${CI_COMMIT_SHA}: ${RUNNER_URL}"
        curl --silent --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${RUNNER_URL}" -o tf_test.py \
          || { echo "[ERROR] Could not obtain tf_test.py (no local copy, API fetch failed)." >&2; exit 2; }
      fi
    - python3 --version
    - terraform version
    # Mutation inside a test job bypasses change control and immutable records.
    # Real provisioning/teardown must use the separately planned/gated components.
    - python3 tf_test.py --tf-root "${TF_ROOT}" --spec "${SPEC_FILE}" --report-dir reports
  artifacts:
    paths:
      - reports/tftest-report.json
    reports:
      junit: reports/tftest-junit.xml
    when: always
  allow_failure: false
