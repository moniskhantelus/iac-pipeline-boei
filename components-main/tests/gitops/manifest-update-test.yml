# Self-test: gitops/manifest-update edits a kustomize overlay and opens an MR against an
# external GitOps repo (SSH clone, deploy-key auth). Because it clones a remote repo before
# the dry_run branch, it cannot run fully hermetically in CI. This is therefore an INJECTION +
# CONFIGURATION contract test proving the component's GitOps safety properties, without pushing.
#
# What is asserted (static, against the published template at this revision):
#   1. IMAGE_REF must be a digest reference (@sha256:) — tags are rejected.
#   2. dry_run short-circuits before push/MR (safe self-test / preview path exists).
#   3. Auth is deploy-key (SSH) via a protected CI variable, not an embedded secret.
#   4. The update is performed with `kustomize edit set image` (declarative, not sed).
#   5. It consumes the upstream image via needs: [<sbom_job>].
include:
  - local: templates/gitops/manifest-update/template.yml   # LOCAL (not catalog @SHA) — resolves on any branch, no catalog release needed (STR-299)
    inputs:
      job_name: test-gitops-update-contract
      stage: test
      image_ref: "kaasappacr.azurecr.us/alpha/gp-api@sha256:deadbeef"
      gitops_repo: "kaas/platform/gitops-fixture"
      overlay_path: "overlays/dev"
      dry_run: "true"
      sbom_job: noop-sbom

# No-op stand-in for the sbom job the component expects in needs:.
noop-sbom:
  stage: test
  image: registry.web.boeing.com/ecs-catalog/docker-images/curl-jq/v1   # TODO(pair): pin tag
  script:
    - echo "IMAGE_REF=kaasappacr.azurecr.us/alpha/gp-api@sha256:deadbeef" | tee image.env
  artifacts:
    reports:
      dotenv: image.env

# Keep the injected GitOps job dormant (it would clone a real repo). manual + allow_failure.
test-gitops-update-contract:
  rules:
    - when: manual
      allow_failure: true

assert-gitops-contract:
  stage: test
  image: registry.web.boeing.com/ecs-catalog/docker-images/curl-jq/v1   # TODO(pair): pin tag
  script:
    - set -euo pipefail
    - tpl=templates/gitops/manifest-update/template.yml
    # 1. Digest-only enforcement
    - grep -q 'is not a digest' "$tpl" || { echo "[FAIL] digest enforcement missing"; exit 1; }
    - grep -q 'sha256:' "$tpl" || { echo "[FAIL] sha256 digest check missing"; exit 1; }
    # 2. dry_run short-circuit before push
    - grep -q 'DRY_RUN' "$tpl" || { echo "[FAIL] dry_run handling missing"; exit 1; }
    - grep -q 'not pushing' "$tpl" || { echo "[FAIL] dry_run short-circuit message missing"; exit 1; }
    # 3. Deploy-key (SSH) auth via protected variable
    - grep -q 'GITOPS_DEPLOY_KEY' "$tpl" || { echo "[FAIL] deploy-key auth missing"; exit 1; }
    # 4. Declarative kustomize edit
    - grep -q 'kustomize edit set image' "$tpl" || { echo "[FAIL] kustomize edit missing"; exit 1; }
    # 5. needs on the sbom/image-producing job
    - grep -q 'inputs.sbom_job' "$tpl" || { echo "[FAIL] sbom_job needs wiring missing"; exit 1; }
    - 'echo "[PASS] gitops/manifest-update contract: digest-only, dry-run, deploy-key, kustomize, needs"'
