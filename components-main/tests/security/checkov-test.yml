# =============================================================================
# Self-test for security/checkov  (STR-223, amends S006)
# -----------------------------------------------------------------------------
# Includes the component from the CURRENT SHA so the revision under test is
# exactly this commit. Exercises both sides of the gate:
#   1. Positive path: the clean fixture (terraform-valid) must PASS -- proves the
#      gate does not produce false positives on compliant code (AC #5).
#   2. Negative path: the HIGH fixture (checkov-high) must FAIL -- proves a
#      critical/high (and null-severity) finding blocks the merge (AC #1/#2/#4).
#      allow_failure:true keeps the pipeline green while verify-checkov-blocks
#      asserts the job actually reached a failed status.
# =============================================================================

include:
  # LOCAL include (not catalog component:@SHA) so the self-test resolves on any branch without a
  # CI/CD Catalog release. See terraform/validate-test.yml for the rationale. (STR-299.)
  # (1) Positive path: clean fixture must pass (no false positives).
  - local: templates/security/checkov/template.yml
    inputs:
      job_name: test-checkov-clean
      stage: test
      scan_dir: tests/fixtures/terraform-valid
  # (2) Negative path: HIGH fixture must fail the gate (blocking finding).
  - local: templates/security/checkov/template.yml
    inputs:
      job_name: test-checkov-high
      stage: test
      scan_dir: tests/fixtures/checkov-high

# The HIGH-fixture job is EXPECTED to fail on the blocking gate. Mark it
# allow_failure so the test pipeline stays green while still proving the gate
# works. verify-checkov-blocks below asserts the job actually reached failed.
test-checkov-high:
  allow_failure: true

# Assert the HIGH-fixture job actually ran and FAILED (the blocking gate works).
verify-checkov-blocks:
  stage: test
  image: registry.web.boeing.com/ecs-catalog/docker-images/curl-jq/v1   # TODO(pair): pin tag
  needs:
    - test-checkov-high
  script:
    - |
      route="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines/${CI_PIPELINE_ID}/jobs"
      status=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "$route" \
        | jq -r '[.[] | select(.name == "test-checkov-high")] | .[0].status')
      echo "[INFO] checkov HIGH-fixture job status: $status"
      if [ "$status" != "failed" ]; then
        echo "[FAIL] expected the HIGH fixture to BLOCK (job failed), got: $status"; exit 1;
      fi
      echo "[PASS] a HIGH/CRITICAL (null-severity) finding correctly failed the job"
