# Self-test: supply-chain/build-image builds and pushes an OCI image to ACR using Managed
# Identity. A real build/push cannot run hermetically in CI (needs ACR + MSI), so this is an
# INJECTION + CONFIGURATION contract test. It proves the component injects a job with the
# required supply-chain controls, without performing a build.
#
# What is asserted (static, against the published template at this revision):
#   1. Static credentials are rejected (ARM_CLIENT_SECRET guard).
#   2. The Dockerfile FROM must match the approved base-image registry.
#   3. Login is Managed Identity (az login --identity), not a static secret.
#   4. The immutable digest is captured and exported for downstream (image.env dotenv).
#   5. Required inputs team/app are honored (component injects with them set).
include:
  - local: templates/supply-chain/build-image/template.yml   # LOCAL (not catalog @SHA) — resolves on any branch, no catalog release needed (STR-299)
    inputs:
      job_name: test-build-image-contract
      stage: test
      team: alpha
      app: gp-api
      dockerfile: Dockerfile
      context: tests/fixtures/onboarding

# The injected build job must never run during the self-test (needs ACR creds).
# Keep it dormant: manual + allow_failure so the pipeline still passes.
test-build-image-contract:
  rules:
    - when: manual
      allow_failure: true

assert-build-image-contract:
  stage: test
  # This assert job only needs a shell + grep (NOT curl/jq despite the old image name). Any image
  # the runner can pull works. Set CI/CD variable ASSERT_IMAGE (project settings or pipeline run)
  # to an image you've confirmed is pullable; the default below is the fallback. (STR-214 debug —
  # ecs-catalog/curl-jq could not be located/pulled on the PROD runner.)
  image: "${ASSERT_IMAGE}"
  variables:
    # Default to the `amp` terraform image (different namespace than the denied ecs-catalog images,
    # UBI8-minimal based so it has a shell + grep). Override via the ASSERT_IMAGE CI/CD variable if
    # you have a lighter image the runner can pull. (STR-214 debug.)
    ASSERT_IMAGE: "registry.web.boeing.com/amp/docker-images/terraform/terraform-azure/ubi8minimal-azterraform/v1.9.2:26.04.15"
  script:
    - set -euo pipefail
    - tpl=templates/supply-chain/build-image/template.yml
    # 1. Static-secret guard
    - grep -q 'ARM_CLIENT_SECRET is set' "$tpl" || { echo "[FAIL] static-secret guard missing"; exit 1; }
    # 2. Approved base-image enforcement
    - grep -q 'BASE_IMAGE_REGISTRY' "$tpl" || { echo "[FAIL] base-image registry not enforced"; exit 1; }
    - grep -q 'approved base registry' "$tpl" || { echo "[FAIL] base-image check message missing"; exit 1; }
    # 3. Managed Identity login (no static secret)
    - grep -q 'az login --identity' "$tpl" || { echo "[FAIL] MSI login missing"; exit 1; }
    # 4. Immutable digest capture + dotenv export
    - grep -q 'skopeo inspect' "$tpl" || { echo "[FAIL] digest capture missing"; exit 1; }
    - grep -q 'IMAGE_REF=' "$tpl" || { echo "[FAIL] IMAGE_REF export missing"; exit 1; }
    - grep -Eq 'dotenv:\s*image.env' "$tpl" || { echo "[FAIL] dotenv artifact missing"; exit 1; }
    - 'echo "[PASS] build-image contract: secret guard, approved base, MSI login, digest export"'
