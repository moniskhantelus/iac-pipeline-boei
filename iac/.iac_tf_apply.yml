# =============================================================================
# GitLab CI Job: Terraform Init + Plan (Azure)
# Purpose: Initializes the Terraform working directory for Azure infrastructure.
#          Authenticates to Azure via Service Principal, generates the provider
#          and backend configuration dynamically, then runs terraform init/plan.
# =============================================================================

iac_apply_job:
  stage: iac_apply

  # TERRAFORM_IMAGE and TERRAFORM_IMAGE_VERSION injected via dotenv from pre_work_job
  image: "${TERRAFORM_IMAGE}:${TERRAFORM_IMAGE_VERSION}"

  variables:
    GIT_SSL_NO_VERIFY: "false"    # Bypass SSL verification for Git operations
    AUDIT_ENVIRONMENT: "$DEPLOY_ENV"     # STR-230 record environment (sandbox|dev|uat|prod)
    AUDIT_MODULE: "$CI_PROJECT_NAME"     # STR-230 record module / blob prefix

  script:
    - set -eo pipefail
    - |
      python3 - <<'VERIFY_GATE_PY'
      import json, os, sys
      from pathlib import Path
      try:
          decision = json.loads((Path(os.environ['CI_PROJECT_DIR']) / 'gate-decision.json').read_text())
          expected = os.environ.get('DEPLOY_ENV') or os.environ.get('TF_ENV')
          if expected not in ('sandbox', 'dev', 'uat', 'prod'):
              raise ValueError('invalid target environment')
          for key, value in [('environment', expected), ('commit_sha', os.environ['CI_COMMIT_SHA']),
                             ('pipeline_id', os.environ['CI_PIPELINE_ID']), ('outcome', 'APPROVED')]:
              if not value or decision.get(key) != value:
                  raise ValueError('gate decision mismatch: ' + key)
          required = {'sandbox': 0, 'dev': 0, 'uat': 1, 'prod': 2}[expected]
          if type(decision.get('approvals_count')) is not int or decision['approvals_count'] < required:
              raise ValueError('gate approval count below story minimum')
          if expected == 'prod' and not decision.get('change_ticket'):
              raise ValueError('production gate has no change record')
      except Exception as exc:
          print('[ERROR] Apply refused: missing or invalid approval gate evidence: ' + str(exc), file=sys.stderr)
          sys.exit(1)
      print('[INFO] Approval gate evidence verified for ' + expected)
      VERIFY_GATE_PY
    - !reference [.str230_runtime, script]
    # Exit immediately on error; propagate errors through pipes
    # Must be first to catch all failures including az login
    #- set -eo pipefail

    - echo "[INFO] Provisioning process started"

    # Extract branch prefix (value before first underscore)
    # e.g., dev_feature -> dev, uat_fix -> uat, main -> main
    - BRANCH_PREFIX="${CI_COMMIT_BRANCH%%_*}"
    - BRANCH_PREFIX_LOWER=$(printf '%s' "${BRANCH_PREFIX}" | tr '[:upper:]' '[:lower:]')
    - BRANCH_PREFIX_UPPER=$(printf '%s' "${BRANCH_PREFIX}" | tr '[:lower:]' '[:upper:]')
    - echo "[INFO] BRANCH_PREFIX=${BRANCH_PREFIX} and BRANCH_PREFIX_UPPER=${BRANCH_PREFIX_UPPER}"


    # Resolve environment-specific CI/CD variables using indirect expansion
    # CI/CD variables must follow the naming pattern: AZ_<prefix>_<variable>
    # e.g., AZ_dev_SP_CLIENT_ID, AZ_uat_SP_CLIENT_SECRET
    - AZ_SUBSCRIPTION_ID="${EIC_KAAS_AZ_dev_SUBSCRIPTION_ID:-}"
    - AZ_SP_CLIENT_ID="${AZ_dev_SP_CLIENT_ID:-}"
    - AZ_SP_CLIENT_SECRET="${AZ_dev_SP_CLIENT_SECRET:-}"
    - AZ_SP_TENANT_ID="${AZ_dev_TENANT_ID:-}"
    - |
      if [ -z "${AZ_SUBSCRIPTION_ID:-}" ] || \
         [ -z "${AZ_SP_CLIENT_ID:-}" ] || \
         [ -z "${AZ_SP_CLIENT_SECRET:-}" ] || \
         [ -z "${AZ_SP_TENANT_ID:-}" ]; then
        echo "ERROR: Required Azure authentication variable is missing"
        exit 1
      fi
      echo "[INFO] Azure credentials are populated"
      # Platform sandbox state backend (has the correct runner IP allow-list).
      # use_azuread_auth=true (below) authenticates as the SP via AAD, avoiding ListKeys.
      AZ_TF_BACKEND_SA_RG="kaas-tfstate-mgmt-rg"
      AZ_TF_BACKEND_SA="kaastfssandbox00sa"
      AZ_BACKEND_CONTAINER="tfstate"


      # The AZ_* variables above hold credential VALUES directly (not names), so reference
      # them directly (no indirect ${!...} expansion). Cloud comes from AZ_LOGIN_CSP_TYPE.
      export ARM_ENVIRONMENT="${AZ_LOGIN_CSP_TYPE}"
      export ARM_SUBSCRIPTION_ID="${AZ_SUBSCRIPTION_ID}"
      export ARM_CLIENT_ID="${AZ_SP_CLIENT_ID}"
      export ARM_CLIENT_SECRET="${AZ_SP_CLIENT_SECRET}"
      export ARM_TENANT_ID="${AZ_SP_TENANT_ID}"


    # Authenticate to Azure using the environment-specific Service Principal
    # AZ_LOGIN_CSP_TYPE is defined in .variables.yml (e.g., AzureUSGovernment)
    - echo "[INFO] Authenticating to Azure via Service Principal..."
    - az cloud set --name "${ARM_ENVIRONMENT}"
    - az login --service-principal -u "${AZ_SP_CLIENT_ID}" -p "${AZ_SP_CLIENT_SECRET}" -t "${AZ_SP_TENANT_ID}"
    - echo "[INFO] Azure authentication successful"
    - az account set --subscription "${AZ_SUBSCRIPTION_ID}"
    - echo "[INFO] Azure authentication successful"

    # Dynamically generate the Terraform provider and backend configuration
    # Single terraform{} block containing both required_providers and backend
    # AZ_TF_BACKEND_RG and AZ_TF_BACKEND_SA must be set as GitLab CI/CD variables

    - ls -la

    # Show Terraform version for audit purposes
    - terraform version
    # Delete the local plugin cache
    - rm -rf .terraform/
    # Delete the lock file safely
    - rm -f .terraform.lock.hcl

    - |
      mkdir -p "$HOME/.terraform.d/plugin-cache"
      cat > "$HOME/.terraformrc" <<'EOF'
      plugin_cache_dir   = "$HOME/.terraform.d/plugin-cache"
      disable_checkpoint = true
      provider_installation {
       direct {
        exclude = ["registry.terraform.io/*/*"]
       }
       network_mirror {
        url = "https://sres.web.boeing.com/artifactory/api/terraform/ecs-hashicorp-remote-releases/providers/"
       }
      }
      EOF
      export TF_CLI_CONFIG_FILE="$HOME/.terraformrc"

    # Initialize Terraform (downloads providers, configures backend)
    #- terraform init
    #- /tmp/scripts/install_tf_providers.sh $SRES_USERNAME $SRES_TOKEN "azurerm" "5.2.0"
    - |
      #cd examples/basic-deployment
      echo "[TEST: Example Base] Executing the terraform example folder Started  "
      echo "Executing the terraform test folder list providers "
      #terraform -chdir=examples/basic-deployment providers
      echo "Executing the terraform test folder init "

    - |
      cat > $CI_PROJECT_DIR/examples/basic/backend.hcl <<EOF
      resource_group_name  = "${AZ_TF_BACKEND_SA_RG}"
      storage_account_name = "${AZ_TF_BACKEND_SA}"
      container_name       = "${AZ_BACKEND_CONTAINER}"
      environment          = "usgovernment"
      use_azuread_auth     = true
      key                  = "terraform/$CI_PROJECT_NAME/$CI_COMMIT_BRANCH/$CI_PROJECT_NAME-$CI_COMMIT_BRANCH.tfstate"
      EOF

    - |
      terraform -chdir=examples/basic init -backend-config=$CI_PROJECT_DIR/examples/basic/backend.hcl
      #terraform -chdir=examples/basic apply -var-file=terraform.tfvars -auto-approve
      echo "[TEST: Example Base] Executing the terraform example folder "
    - |
      python3 - <<'VERIFY_PLAN_PY'
      import hashlib, os
      from pathlib import Path
      root = Path(os.environ['CI_PROJECT_DIR'])
      expected = (root / 'plan.tfplan.sha256').read_text().strip()
      actual = hashlib.sha256((root / 'reports/terraform/plan.tfplan').read_bytes()).hexdigest()
      if expected != actual:
          raise SystemExit('[ERROR] Saved plan hash mismatch; apply refused')
      VERIFY_PLAN_PY
    - python3 "${CI_PROJECT_DIR}/.str230/audit.py" apply
    - cat $CI_PROJECT_DIR/examples/basic/backend.hcl
    - ls -la

    #- |
    #  echo "[TEST: Example Complete] Executing the terraform example folder Start "
    #  terraform -chdir=examples/basic init -backend-config=../backend.hcl
    #  terraform -chdir=examples/complete apply -var-file=terraform.tfvars -auto-approve
    #  echo "[TEST: Example Complete] Executing the terraform example folder Completed "

    #- |
    #  echo "Executing the terraform test folder "
    #  terraform -chdir=examples/basic-deployment init
    #  terraform -chdir=examples/basic-deployment  apply -backup=- -var-file=terraform.tfvars -auto-approve

    #- |
    #  echo "Executing the terraform test folder "
    #  terraform -chdir=examples/complete init
    #  terraform -chdir=examples/complete apply -backup=- -var-file=terraform.tfvars -auto-approve
  after_script:
    - python3 "${CI_PROJECT_DIR}/.str230/audit.py" finalize
  needs:
    - job: iac_init_job
      artifacts: true
    - job: iac_gates_job
      artifacts: true
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - reports/terraform/terraform-apply-output.txt
      - reports/terraform/audit.json
      - reports/terraform/audit-upload.txt
  allow_failure: false
