# =============================================================================
# GitLab CI Job: Terraform Init + Plan (Azure)
# Purpose: Initializes the Terraform working directory for Azure infrastructure.
#          Authenticates to Azure via Service Principal, generates the provider
#          and backend configuration dynamically, then runs terraform init/plan.
# =============================================================================

iac_destroy_job:
  stage: iac_destroy

  # TERRAFORM_IMAGE and TERRAFORM_IMAGE_VERSION injected via dotenv from pre_work_job
  image: "${TERRAFORM_IMAGE}:${TERRAFORM_IMAGE_VERSION}"

  variables:
    GIT_SSL_NO_VERIFY: "true"    # Bypass SSL verification for Git operations

  script:
    # Exit immediately on error; propagate errors through pipes
    # Must be first to catch all failures including az login
    #- set -eo pipefail

    - echo "[INFO] Provisioning process started"

    # Extract branch prefix (value before first underscore)
    # e.g., dev_feature -> dev, uat_fix -> uat, main -> main
    - BRANCH_PREFIX="${CI_COMMIT_BRANCH%%_*}"
    - BRANCH_PREFIX_UPPER="${BRANCH_PREFIX^^}"
    - BRANCH_PREFIX_LOWER=${BRANCH_PREFIX,,}
    - echo "[INFO] BRANCH_PREFIX=${BRANCH_PREFIX} and BRANCH_PREFIX_UPPER=${BRANCH_PREFIX_UPPER} and BRANCH_PREFIX_LOWER=${BRANCH_PREFIX_LOWER}"


    # Resolve Azure CI/CD variables. These hold credential VALUES directly (not names),
    # matching the init/apply jobs. Reference them directly (no indirect ${!...} expansion).
    - AZ_SUBSCRIPTION_ID="${EIC_KAAS_AZ_dev_SUBSCRIPTION_ID:-}"
    - AZ_SP_CLIENT_ID="${AZ_dev_SP_CLIENT_ID:-}"
    - AZ_SP_CLIENT_SECRET="${AZ_dev_SP_CLIENT_SECRET:-}"
    - AZ_SP_TENANT_ID="${AZ_dev_TENANT_ID:-}"
    - |
      if [ -z "${AZ_SUBSCRIPTION_ID:-}" ] || \
         [ -z "${AZ_SP_CLIENT_ID:-}" ] || \
         [ -z "${AZ_SP_CLIENT_SECRET:-}" ] || \
         [ -z "${AZ_SP_TENANT_ID:-}" ]; then
        echo "ERROR: Required Azure authentication variable is missing"
        exit 1
      fi
      echo "[INFO] Azure credentials are populated"
      # Platform sandbox state backend (has the correct runner IP allow-list).
      AZ_TF_BACKEND_SA_RG="kaas-tfstate-mgmt-rg"
      AZ_TF_BACKEND_SA="kaastfssandbox00sa"
      AZ_BACKEND_CONTAINER="tfstate"

      # Cloud comes from AZ_LOGIN_CSP_TYPE (AZ_CSP_TYPE was undefined).
      export ARM_ENVIRONMENT="${AZ_LOGIN_CSP_TYPE}"
      export ARM_SUBSCRIPTION_ID="${AZ_SUBSCRIPTION_ID}"
      export ARM_CLIENT_ID="${AZ_SP_CLIENT_ID}"
      export ARM_CLIENT_SECRET="${AZ_SP_CLIENT_SECRET}"
      export ARM_TENANT_ID="${AZ_SP_TENANT_ID}"

    # Authenticate to Azure using the Service Principal
    - echo "[INFO] Authenticating to Azure via Service Principal...${ARM_ENVIRONMENT}"
    - az cloud set --name "${ARM_ENVIRONMENT}"
    - az login --service-principal -u "${AZ_SP_CLIENT_ID}" -p "${AZ_SP_CLIENT_SECRET}" -t "${AZ_SP_TENANT_ID}"
    - echo "[INFO] Azure authentication successful"
    - az account set --subscription "${AZ_SUBSCRIPTION_ID}"
    - echo "[INFO] Azure authentication successful"

    # Dynamically generate the Terraform provider and backend configuration
    # Single terraform{} block containing both required_providers and backend
    # AZ_TF_BACKEND_RG and AZ_TF_BACKEND_SA must be set as GitLab CI/CD variables

    - ls -la

    # Show Terraform version for audit purposes
    - terraform version
    # Delete the local plugin cache
    - rm -rf .terraform/
    # Delete the lock file safely
    - rm -f .terraform.lock.hcl

    - |
      mkdir -p "$HOME/.terraform.d/plugin-cache"
      cat > "$HOME/.terraformrc" <<'EOF'
      plugin_cache_dir   = "$HOME/.terraform.d/plugin-cache"
      disable_checkpoint = true
      provider_installation {
       direct {
        exclude = ["registry.terraform.io/*/*"]
       }
       network_mirror {
        url = "https://sres.web.boeing.com/artifactory/api/terraform/ecs-hashicorp-remote-releases/providers/"
       }
      }
      EOF
      export TF_CLI_CONFIG_FILE="$HOME/.terraformrc"

    # Initialize Terraform (downloads providers, configures backend)
    #- terraform init
    #- /tmp/scripts/install_tf_providers.sh $SRES_USERNAME $SRES_TOKEN "azurerm" "5.2.0" 
    - |
      #cd examples/basic-deployment
      echo "[TEST: Example Base] Executing the terraform example folder Started  "
      echo "Executing the terraform test folder list providers "
      #terraform -chdir=examples/basic-deployment providers
      echo "Executing the terraform test folder init "

    - |
      cat > $CI_PROJECT_DIR/examples/basic/statefile.tf <<EOF
      terraform {
         backend "azurerm" {} 
      }  
      EOF
    - |
      cat > $CI_PROJECT_DIR/examples/basic/backend.hcl <<EOF
      resource_group_name  = "${AZ_TF_BACKEND_SA_RG}"
      storage_account_name = "${AZ_TF_BACKEND_SA}"
      container_name       = "${AZ_BACKEND_CONTAINER}"
      environment          = "usgovernment"
      use_azuread_auth     = true
      key                  = "terraform/$CI_PROJECT_NAME/$CI_COMMIT_BRANCH/$CI_PROJECT_NAME-$CI_COMMIT_BRANCH.tfstate"  
      EOF  

    - |
      terraform -chdir=examples/basic init -backend-config=$CI_PROJECT_DIR/examples/basic/backend.hcl
      terraform -chdir=examples/basic destroy -var-file=terraform.tfvars -auto-approve
      echo "[TEST: Example Base] Executing the terraform example folder "
    - cat $CI_PROJECT_DIR/examples/basic/backend.hcl || true
    - ls -la

    #- |
    #  echo "[TEST: Example Complete] Executing the terraform example folder Start "
    #  terraform -chdir=examples/complete init 
    #  terraform -chdir=examples/complete destroy -var-file=terraform.tfvars -auto-approve
    #  echo "[TEST: Example Complete] Executing the terraform example folder Completed " 

  # Destroy is destructive AND optional ("only when we need to tear down").
  # when:manual     -> never runs automatically; requires an explicit click.
  # allow_failure:true -> OPTIONAL: the pipeline completes successfully without it,
  #                       so destroy does not leave the pipeline "blocked" waiting.
  #                       It sits as a manual button to trigger on demand.
  when: manual
  allow_failure: true