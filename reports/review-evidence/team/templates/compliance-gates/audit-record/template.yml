spec:
  inputs:
    job_name:
      description: "CI job name. Allows the component to be included more than once."
      default: audit-record
    stage:
      description: "Stage this job runs in. Place AFTER the apply stage so it records the outcome."
      default: apply
    environment:
      description: "Target environment the apply acted on (dev|uat|prod|shared-services|...)."
      # required — no default
    module:
      description: "Target module / Terraform root the change applied to (for compliance queries)."
      # required — no default
    apply_job:
      description: "Name of the terraform/apply job whose outcome + artifacts are recorded."
      default: tf-apply
    plan_job:
      description: "Name of the terraform/plan job that produced plan.tfplan.sha256 (the plan hash)."
      default: tf-plan
    tf_root:
      description: "Path (relative to repo root) where plan/apply wrote their artifacts."
      default: "."
    audit_storage_account:
      description: "WORM storage account in shared-services (provisioned out-of-band; see README). Consumed by NAME, never a secret."
      default: "$AUDIT_STORAGE_ACCOUNT"
    audit_container:
      description: "Immutable (WORM) blob container the record is written to."
      default: "audit"
    arm_environment:
      description: "Azure cloud for az CLI (AzureUSGovernment for Gov)."
      default: "AzureUSGovernment"
    audit_image:
      description: "Boeing-internal image with az CLI + jq."
      default: "registry.web.boeing.com/amp/docker-images/terraform/terraform-azure/ubi8minimal-azterraform/v1.9.2"
    audit_image_version:
      description: "Tag of the audit image."
      default: "26.04.15"
  component:
    - name
    - version
---

"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: "$[[ inputs.audit_image ]]:$[[ inputs.audit_image_version ]]"
  variables:
    AUDIT_ENV: "$[[ inputs.environment ]]"
    AUDIT_MODULE: "$[[ inputs.module ]]"
    TF_ROOT: "$[[ inputs.tf_root ]]"
    AUDIT_ACCOUNT: "$[[ inputs.audit_storage_account ]]"
    AUDIT_CONTAINER: "$[[ inputs.audit_container ]]"
    ARM_ENVIRONMENT_NAME: "$[[ inputs.arm_environment ]]"
  # Pull the apply job's result + the plan hash artifact. needs:...artifacts:true gives us the
  # plan.tfplan.sha256 and apply.log; the apply job's success/failure is read from CI env below.
  needs:
    - job: "$[[ inputs.apply_job ]]"
      artifacts: true
      optional: true
    - job: "$[[ inputs.plan_job ]]"
      artifacts: true
      optional: true
  # STR-230: record EVERY apply — success OR failure. when: always is what captures failed applies.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^(sandbox|dev|uat|main)(_[a-zA-Z0-9_]+)?$/'
      when: always
    - when: never
  script:
    - set -uo pipefail
    # --- Guard: static credentials are prohibited (zero-static-credential requirement) ---
    - |
      if [ -n "${ARM_CLIENT_SECRET:-}" ]; then
        echo "[ERROR] ARM_CLIENT_SECRET is set. Static credentials are prohibited. Use Managed Identity." >&2
        exit 1
      fi
    # --- Determine the apply outcome. CI_JOB_STATUS of THIS job is success; the APPLY outcome is
    #     passed in via the dotenv the apply job exports, or inferred from the artifact presence. ---
    - |
      OUTCOME="unknown"
      if [ -f "${TF_ROOT}/apply.log" ]; then
        if grep -q "Apply complete" "${TF_ROOT}/apply.log" 2>/dev/null; then OUTCOME="success"; else OUTCOME="failure"; fi
      else
        # No apply.log means the apply job did not run to the point of writing it -> treat as failure.
        OUTCOME="failure"
      fi
      echo "[INFO] Derived apply outcome: ${OUTCOME}"
    # --- Plan hash (dependency): read the sha256 the plan job produced. ---
    - |
      PLAN_HASH="unavailable"
      if [ -f "${TF_ROOT}/plan.tfplan.sha256" ]; then
        PLAN_HASH="$(awk '{print $1}' "${TF_ROOT}/plan.tfplan.sha256" | head -n1)"
      fi
    # --- Build the 11-field structured audit record (S010). ---
    - |
      TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      RECORD_FILE="audit-${AUDIT_ENV}-${CI_PIPELINE_ID}-${CI_JOB_ID}.json"
      jq -n \
        --arg actor        "${GITLAB_USER_LOGIN:-${CI_COMMIT_AUTHOR:-unknown}}" \
        --arg commit_sha   "${CI_COMMIT_SHA:-unknown}" \
        --arg plan_hash    "${PLAN_HASH}" \
        --arg timestamp    "${TS}" \
        --arg environment  "${AUDIT_ENV}" \
        --arg module       "${AUDIT_MODULE}" \
        --arg outcome      "${OUTCOME}" \
        --arg pipeline_id  "${CI_PIPELINE_ID:-unknown}" \
        --arg job_id       "${CI_JOB_ID:-unknown}" \
        --arg project_path "${CI_PROJECT_PATH:-unknown}" \
        --arg mr_ref       "${CI_MERGE_REQUEST_IID:-${CI_COMMIT_REF_NAME:-unknown}}" \
        '{actor:$actor, commit_sha:$commit_sha, plan_hash:$plan_hash, timestamp:$timestamp,
          environment:$environment, module:$module, outcome:$outcome, pipeline_id:$pipeline_id,
          job_id:$job_id, project_path:$project_path, mr_ref:$mr_ref}' > "${RECORD_FILE}"
      echo "[INFO] Audit record ${RECORD_FILE}:"; cat "${RECORD_FILE}"
      # Fail closed if the record is not valid JSON with all 11 fields.
      FIELDS=$(jq -r 'keys | length' "${RECORD_FILE}")
      if [ "${FIELDS}" -ne 11 ]; then echo "[ERROR] audit record has ${FIELDS} fields, expected 11" >&2; exit 1; fi
    # --- Managed Identity auth, then write the record to the WORM container. ---
    - |
      export ARM_USE_MSI="true"
      az cloud set --name "${ARM_ENVIRONMENT_NAME}"
      az login --identity --output none
      # Blob path encodes env/module/date so the query tool can filter by prefix.
      DAY="$(date -u +%Y/%m/%d)"
      BLOB_PATH="${AUDIT_ENV}/${AUDIT_MODULE}/${DAY}/${RECORD_FILE}"
      echo "[INFO] Writing audit record to ${AUDIT_ACCOUNT}/${AUDIT_CONTAINER}/${BLOB_PATH}"
      # --auth-mode login uses the Managed Identity; the WORM policy on the container makes this
      # write immutable. A second upload to the same path is rejected by immutability (no overwrite).
      if ! az storage blob upload \
            --account-name "${AUDIT_ACCOUNT}" \
            --container-name "${AUDIT_CONTAINER}" \
            --name "${BLOB_PATH}" \
            --file "${RECORD_FILE}" \
            --auth-mode login \
            --no-progress --only-show-errors; then
        echo "[ERROR] Failed to write audit record to the immutable store — failing closed." >&2
        exit 1
      fi
      echo "[INFO] Audit record committed to immutable store."
  artifacts:
    # Operational copy (90 days). The WORM store is the compliance record of truth.
    name: "audit-$[[ inputs.environment ]]-$CI_COMMIT_SHORT_SHA"
    paths:
      - "audit-*.json"
    expire_in: 90 days
    when: always
  allow_failure: false
