spec:
  inputs:
    job_name:
      description: "CI job name."
      default: policy-gate
    stage:
      description: "Stage this job runs in."
      default: policy
    engine:
      description: "Policy engine: kyverno (default) or conftest."
      default: kyverno
    input_type:
      description: "What to validate: manifests (k8s YAML) or tfplan (terraform plan JSON)."
      default: manifests
    manifest_dir:
      description: "Directory of Kubernetes manifests to validate (input_type=manifests)."
      default: "k8s"
    tfplan_json:
      description: "Path to terraform plan JSON (input_type=tfplan)."
      default: "plan.tfplan.json"
    policy_repo:
      description: "Platform policy library repo path."
      default: "kaas/platform/policy-library"
    policy_ref:
      description: "Pinned tag/branch of the policy library to validate against."
      default: "v1.0.0"
    policy_image:
      description: "Boeing-internal image with kyverno + conftest + git + jq."
      default: "registry.web.boeing.com/ecs-catalog/docker-images/policy-tools/v1"
    policy_image_version:
      description: "Pinned tag."
      default: "1.0.0"
  component:
    - name
    - version
---

"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: "$[[ inputs.policy_image ]]:$[[ inputs.policy_image_version ]]"
  variables:
    ENGINE: "$[[ inputs.engine ]]"
    INPUT_TYPE: "$[[ inputs.input_type ]]"
    MANIFEST_DIR: "$[[ inputs.manifest_dir ]]"
    TFPLAN_JSON: "$[[ inputs.tfplan_json ]]"
    POLICY_REPO: "$[[ inputs.policy_repo ]]"
    POLICY_REF: "$[[ inputs.policy_ref ]]"
  script:
    - set -euo pipefail
    # Pull the policy set at a pinned ref (CI job token; read-only).
    - git clone --depth 1 --branch "${POLICY_REF}" "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${POLICY_REPO}.git" .policies
    - |
      if [ "${INPUT_TYPE}" = "tfplan" ]; then
        if [ ! -f "${TFPLAN_JSON}" ]; then echo "[ERROR] ${TFPLAN_JSON} not found." >&2; exit 1; fi
        echo "[INFO] conftest over terraform plan JSON"
        conftest test "${TFPLAN_JSON}" --policy .policies/terraform --all-namespaces
        exit $?
      fi
    - |
      echo "[INFO] Validating manifests in ${MANIFEST_DIR} with ${ENGINE}"
      if [ "${ENGINE}" = "kyverno" ]; then
        kyverno apply .policies/kyverno/ --resource "${MANIFEST_DIR}" --table
      else
        conftest test "${MANIFEST_DIR}"/*.y*ml --policy .policies/rego
      fi
    - echo "[INFO] policy-gate passed ($CI_PROJECT_PATH@$CI_COMMIT_SHORT_SHA)"
  allow_failure: false
