spec:
  inputs:
    job_name:
      description: "CI job name."
      default: sbom
    stage:
      description: "Stage this job runs in."
      default: sbom
    image_ref:
      description: "Image reference to document (repo@sha256:digest)."
      default: "$IMAGE_REF"
    sign_job:
      description: "Name of the sign job (needs:)."
      default: sign-image
    signing_key_uri:
      description: "KMS key URI used to sign the attestation (azurekms:// | awskms:// | gcpkms://)."
      # required
    syft_image:
      description: "Boeing-internal image bundling Syft + Cosign."
      default: "registry.web.boeing.com/ecs-catalog/docker-images/syft-cosign/v1"
    syft_image_version:
      description: "Pinned tag."
      default: "1.14.0"
  component:
    - name
    - version
---

"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: "$[[ inputs.syft_image ]]:$[[ inputs.syft_image_version ]]"
  needs:
    - job: "$[[ inputs.sign_job ]]"
      artifacts: true
  variables:
    IMAGE_REF: "$[[ inputs.image_ref ]]"
    COSIGN_KEY: "$[[ inputs.signing_key_uri ]]"
    COSIGN_YES: "true"
  script:
    - set -euo pipefail
    - |
      if [ -z "${IMAGE_REF:-}" ]; then echo "[ERROR] IMAGE_REF empty." >&2; exit 1; fi
      if [ -n "${ARM_CLIENT_SECRET:-}" ]; then echo "[ERROR] Static credentials prohibited." >&2; exit 1; fi
    - az login --identity --output none
    - az acr login --name "$(echo "${IMAGE_REF}" | cut -d/ -f1 | cut -d. -f1)"
    - syft "${IMAGE_REF}" -o cyclonedx-json=sbom.cdx.json
    - jq -e '.bomFormat == "CycloneDX"' sbom.cdx.json > /dev/null
    - cosign attest --predicate sbom.cdx.json --type cyclonedx --key "${COSIGN_KEY}" "${IMAGE_REF}"
    - 'echo "[INFO] SBOM attested to ${IMAGE_REF}"'
  artifacts:
    paths: [sbom.cdx.json]
    expire_in: 1 year
    when: on_success
  allow_failure: false
