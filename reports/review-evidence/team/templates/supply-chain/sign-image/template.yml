spec:
  inputs:
    job_name:
      description: "CI job name."
      default: sign-image
    stage:
      description: "Stage this job runs in."
      default: sign
    image_ref:
      description: "Image reference to sign (repo@sha256:digest)."
      default: "$IMAGE_REF"
    scan_job:
      description: "Name of the scan job (needs: so sign runs only after scan passes)."
      default: scan-image
    signing_key_uri:
      description: "KMS key URI (azurekms:// | awskms:// | gcpkms://)."
      # required
    cosign_image:
      description: "Boeing-internal Cosign image."
      default: "registry.web.boeing.com/ecs-catalog/docker-images/cosign/v2"
    cosign_image_version:
      description: "Pinned Cosign tag."
      default: "2.4.1"
  component:
    - name
    - version
---

"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: "$[[ inputs.cosign_image ]]:$[[ inputs.cosign_image_version ]]"
  needs:
    - job: "$[[ inputs.scan_job ]]"
      artifacts: true
  variables:
    IMAGE_REF: "$[[ inputs.image_ref ]]"
    COSIGN_KEY: "$[[ inputs.signing_key_uri ]]"
    COSIGN_YES: "true"
  script:
    - set -euo pipefail
    - |
      if [ -z "${IMAGE_REF:-}" ]; then echo "[ERROR] IMAGE_REF empty." >&2; exit 1; fi
      if [ -n "${ARM_CLIENT_SECRET:-}" ]; then echo "[ERROR] Static credentials prohibited." >&2; exit 1; fi
    # Managed Identity enables cosign to reach Azure Key Vault for azurekms:// keys.
    - az login --identity --output none
    - REGISTRY="$(echo "${IMAGE_REF}" | cut -d/ -f1 | cut -d. -f1)"
    - az acr login --name "${REGISTRY}"
    - 'echo "[INFO] Signing ${IMAGE_REF} with ${COSIGN_KEY}"'
    - cosign sign --key "${COSIGN_KEY}" "${IMAGE_REF}"
    - cosign triangulate "${IMAGE_REF}" | tee signature.ref
    - 'echo "[INFO] Signed ${IMAGE_REF} (component $CI_PROJECT_PATH@$CI_COMMIT_SHORT_SHA)"'
  artifacts:
    paths: [signature.ref]
    when: on_success
  allow_failure: false
