# Self-test: compliance-gates/audit-record writes a structured 11-field JSON record to an immutable
# WORM store on every apply (success OR failure) via Managed Identity (STR-230). The real upload
# needs Azure + a WORM container, so it CANNOT run hermetically in CI. This is therefore an
# INJECTION + CONFIGURATION contract test plus a FUNCTIONAL check of the compliance query tool.
#
# What is asserted (static, against the published template at this revision):
#   1. Runs on EVERY apply — success or failure — via when: always (records failed applies).
#   2. Managed Identity enforced; a static ARM_CLIENT_SECRET is rejected.
#   3. The record carries all 11 compliance fields and is validated (fails closed if != 11).
#   4. The plan hash (dependency) is read from plan.tfplan.sha256.
#   5. The record is written to the immutable WORM container via az storage blob upload (MSI).
#   6. Fails closed if the immutable write fails (no silent success).
# Plus a FUNCTIONAL check (hermetic): query_audit.py --source local filters the fixture records.
include:
  - local: templates/compliance-gates/audit-record/template.yml
    inputs:
      job_name: test-audit-record-contract
      stage: test
      environment: test
      module: fixture
      tf_root: tests/fixtures/terraform-local

# The injected audit-record job must never run during the self-test (needs Azure + WORM store).
# Keep it dormant: manual + allow_failure so the pipeline still passes.
test-audit-record-contract:
  rules:
    - when: manual
      allow_failure: true

assert-audit-record-contract:
  stage: test
  image: "${ASSERT_IMAGE}"
  variables:
    # Needs a shell + grep + python3 (for the query-tool functional check). The amp terraform image
    # is UBI8-minimal with python3; override ASSERT_IMAGE if the runner can't pull it (STR-214).
    ASSERT_IMAGE: "registry.web.boeing.com/amp/docker-images/terraform/terraform-azure/ubi8minimal-azterraform/v1.9.2:26.04.15"
  script:
    - set -euo pipefail
    - tpl=templates/compliance-gates/audit-record/template.yml
    # 1. Records every apply — success or failure (when: always)
    - 'grep -Eq ''when:\s*always'' "$tpl" || { echo "[FAIL] audit record must run on every apply (when always)"; exit 1; }'
    - grep -q 'record EVERY apply' "$tpl" || { echo "[FAIL] success+failure intent missing"; exit 1; }
    # 2. Managed Identity enforced; static secret rejected
    - grep -q 'ARM_USE_MSI' "$tpl" || { echo "[FAIL] MSI not enforced"; exit 1; }
    - grep -q 'az login --identity' "$tpl" || { echo "[FAIL] MSI login missing"; exit 1; }
    - grep -q 'ARM_CLIENT_SECRET is set' "$tpl" || { echo "[FAIL] static-secret guard missing"; exit 1; }
    # 3. 11-field record built + validated
    - grep -q 'commit_sha' "$tpl" || { echo "[FAIL] commit_sha field missing"; exit 1; }
    - grep -q 'plan_hash' "$tpl" || { echo "[FAIL] plan_hash field missing"; exit 1; }
    - grep -q 'project_path' "$tpl" || { echo "[FAIL] project_path field missing"; exit 1; }
    - grep -Eq 'ne 11|-ne 11' "$tpl" || { echo "[FAIL] 11-field validation missing"; exit 1; }
    # 4. Plan hash read from the sha256 artifact
    - grep -q 'plan.tfplan.sha256' "$tpl" || { echo "[FAIL] plan hash source missing"; exit 1; }
    # 5. Written to the immutable WORM container
    - grep -q 'az storage blob upload' "$tpl" || { echo "[FAIL] WORM blob upload missing"; exit 1; }
    - grep -q 'auth-mode login' "$tpl" || { echo "[FAIL] MSI auth-mode for upload missing"; exit 1; }
    # 6. Fails closed if the immutable write fails
    - grep -q 'failing closed' "$tpl" || { echo "[FAIL] fail-closed on upload failure missing"; exit 1; }
    # --- Functional check: the compliance query tool filters the fixture records ---
    - q=templates/compliance-gates/audit-record/query_audit.py
    - fx=tests/fixtures/audit-records
    - python3 "$q" --source local --path "$fx" --format table
    # Use the query tool's --count (prints just the number) so the asserts stay quote-clean.
    - ALL=$(python3 "$q" --source local --path "$fx" --count)
    - test "$ALL" = "2" || { echo "[FAIL] expected 2 fixture records, got $ALL"; exit 1; }
    - PROD=$(python3 "$q" --source local --path "$fx" --environment prod --count)
    - test "$PROD" = "1" || { echo "[FAIL] env=prod expected 1, got $PROD"; exit 1; }
    - FAILREC=$(python3 "$q" --source local --path "$fx" --outcome failure --count)
    - test "$FAILREC" = "1" || { echo "[FAIL] outcome=failure expected 1 (failed applies recorded), got $FAILREC"; exit 1; }
    - echo "[PASS] audit-record contract - query tool filters by env/outcome; static controls verified above"
