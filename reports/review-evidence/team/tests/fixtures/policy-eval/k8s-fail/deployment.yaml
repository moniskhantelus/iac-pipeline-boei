# Violates require-nonroot, require-resources, require-labels (Enforce) + approved-registry (Audit).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-api
  template:
    metadata:
      labels:
        app: bad-api
    spec:
      containers:
        - name: api
          image: docker.io/library/nginx:latest
          # no resources, no securityContext
