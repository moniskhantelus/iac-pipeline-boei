# =============================================================================
# Self-test for terraform/validate  (STR-215)
# -----------------------------------------------------------------------------
# Includes the component from the CURRENT SHA so the revision under test is
# exactly this commit. Exercises four acceptance criteria:
#   1. Happy path: validate the terraform-valid fixture (fmt + init -backend=false
#      + validate all succeed on a runner with no Azure credentials).
#   2. Multiple-include: a SECOND include with a different job_name must produce a
#      SECOND, distinct job -- proven by verify-validate-job-present counting both.
#   3. Negative fmt: the terraform-bad-fmt fixture with fail_on_fmt=true must FAIL;
#      allow_failure:true (set on the override below) keeps the pipeline green while
#      asserting the job did not pass.
#   4. Injection: verify-validate-job-present queries the jobs API and confirms both
#      injected validate jobs are present in the pipeline.
# =============================================================================

include:
  # LOCAL include (not catalog component:@SHA): the component templates live in THIS repo, so we
  # include them by path. This resolves on any branch/commit WITHOUT a CI/CD Catalog release —
  # self-tests run on check-in exactly as if the components were published. `local:` supports
  # `inputs:` for templates that declare a `spec:inputs:` header, so behavior matches a catalog
  # include. (STR-299: enables branch self-tests pre-registration.)
  # (1) Happy path against the valid fixture.
  - local: templates/terraform/validate/template.yml
    inputs:
      job_name: test-terraform-validate
      stage: test
      tf_root: tests/fixtures/terraform-valid
  # (2) Second include with a DISTINCT job_name -> must yield a second, distinct job.
  - local: templates/terraform/validate/template.yml
    inputs:
      job_name: test-terraform-validate-second
      stage: test
      tf_root: tests/fixtures/terraform-valid
  # (3) Negative test: mis-formatted fixture with fail_on_fmt=true must fail the job.
  - local: templates/terraform/validate/template.yml
    inputs:
      job_name: test-terraform-validate-bad-fmt
      stage: test
      tf_root: tests/fixtures/terraform-bad-fmt
      fail_on_fmt: "true"

# Self-tests run only on branch/MR CI — NEVER on a tag (release) pipeline. On a tag pipeline the
# only job is create-release; the injected validate jobs are not created there, which previously
# made verify-* `needs:` reference non-existent jobs and FAILED the whole release pipeline at
# compile time (blocking catalog publishing). This anchor applies the branch/MR-only rule to every
# self-test job below. [STR-215]
.selftest_rules: &selftest_rules
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Also gate the three INJECTED validate jobs off tag pipelines (they come from the template
# includes above, which declare no rules, so without this they would try to run on the tag
# pipeline too). Overriding by job name merges these rules into the injected jobs.
test-terraform-validate:
  <<: *selftest_rules
test-terraform-validate-second:
  <<: *selftest_rules

# The bad-fmt job is EXPECTED to fail on `terraform fmt -check`. Mark it
# allow_failure so the test pipeline stays green while still proving the gate works.
# verify-validate-fmt-fails below asserts the job actually reached a failed status.
test-terraform-validate-bad-fmt:
  <<: *selftest_rules
  allow_failure: true

# (4) Confirm both passing validate jobs were injected into the pipeline.
verify-validate-job-present:
  <<: *selftest_rules
  stage: test
  # Needs curl + jq (GitLab jobs API). Use a runner-pullable image (the PROD runner cannot pull
  # ecs-catalog images — STR-214); the amp terraform image ships curl + jq. Override via ASSERT_IMAGE.
  image: "${ASSERT_IMAGE}"
  variables:
    ASSERT_IMAGE: "registry.web.boeing.com/amp/docker-images/terraform/terraform-azure/ubi8minimal-azterraform/v1.9.2:26.04.15"
  needs:
    - test-terraform-validate
    - test-terraform-validate-second
  script:
    - |
      # Fetch ALL jobs for this pipeline, paginating. The jobs API returns only 20 per page by
      # default; this pipeline has 30+ jobs, so a single un-paginated call silently truncates and
      # the job we are looking for may be on a later page (returns null). Accumulate every page
      # into one JSON array before querying it.  [STR-215]
      base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines/${CI_PIPELINE_ID}/jobs"
      page=1; all="[]"
      while :; do
        resp=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${base}?per_page=100&page=${page}")
        # Stop when a page comes back empty (or not an array).
        n=$(echo "$resp" | jq 'if type=="array" then length else 0 end')
        [ "$n" -eq 0 ] && break
        # Merge this page into the accumulator. Pass the running array via --argjson (POSIX sh safe;
        # no bash process substitution) and concatenate with the fresh page on stdin.
        all=$(echo "$resp" | jq --argjson acc "$all" '$acc + .')
        [ "$n" -lt 100 ] && break
        page=$((page + 1))
      done
      echo "[INFO] fetched $(echo "$all" | jq 'length') total jobs across ${page} page(s)"
      count=$(echo "$all" | jq 'map(select(.name | startswith("test-terraform-validate"))) | length')
      echo "[INFO] matched $count validate job(s)"
      # Expect at least the two happy-path jobs + the bad-fmt job = 3.
      if [ "$count" -lt 2 ]; then echo "[FAIL] distinct validate jobs not injected"; exit 1; fi
      first=$(echo "$all" | jq '[.[] | select(.name == "test-terraform-validate")] | length')
      second=$(echo "$all" | jq '[.[] | select(.name == "test-terraform-validate-second")] | length')
      if [ "$first" -lt 1 ] || [ "$second" -lt 1 ]; then
        echo "[FAIL] two includes did not produce two distinct named jobs"; exit 1;
      fi
      echo "[PASS] two includes produced two distinct validate jobs"

# Assert the bad-fmt job actually ran and FAILED (the fmt gate works).
verify-validate-fmt-fails:
  <<: *selftest_rules
  stage: test
  # Needs curl + jq (GitLab jobs API). Runner-pullable image (not ecs-catalog — STR-214).
  image: "${ASSERT_IMAGE}"
  variables:
    ASSERT_IMAGE: "registry.web.boeing.com/amp/docker-images/terraform/terraform-azure/ubi8minimal-azterraform/v1.9.2:26.04.15"
  needs:
    # allow_failure:true so this verify job is released even though bad-fmt fails (that failure is
    # the thing under test). `needs` releases us the instant bad-fmt finishes, but the jobs API can
    # lag a beat before it reports the terminal status — so we POLL below rather than read once.
    - job: test-terraform-validate-bad-fmt
      optional: false
  script:
    - |
      base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines/${CI_PIPELINE_ID}/jobs"
      # Find the bad-fmt job and read its status. TWO failure modes are handled here:
      #   1. Pagination: the jobs API returns 20 per page by default and this pipeline has 30+
      #      jobs, so the bad-fmt job can live on a later page. We MUST page through all jobs
      #      (per_page=100 + page loop) or an exact-name lookup returns null forever. [STR-215]
      #   2. Timing: `needs` releases us the instant bad-fmt finishes, but its terminal status may
      #      lag in the API for a beat, so we poll until terminal or time out.
      fetch_all_jobs() {
        page=1; all="[]"
        while :; do
          resp=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${base}?per_page=100&page=${page}")
          n=$(echo "$resp" | jq 'if type=="array" then length else 0 end')
          [ "$n" -eq 0 ] && break
          # POSIX sh safe merge (no bash process substitution): running array via --argjson.
          all=$(echo "$resp" | jq --argjson acc "$all" '$acc + .')
          [ "$n" -lt 100 ] && break
          page=$((page + 1))
        done
        echo "$all"
      }
      status=""
      for attempt in $(seq 1 30); do
        jobs=$(fetch_all_jobs)
        status=$(echo "$jobs" | jq -r '[.[] | select(.name == "test-terraform-validate-bad-fmt")] | .[0].status // "null"')
        echo "[INFO] attempt ${attempt}: total jobs=$(echo "$jobs" | jq 'length'), bad-fmt status=${status}"
        case "${status}" in
          failed|success|canceled|skipped|manual) break ;;
        esac
        sleep 2
      done
      if [ "${status}" != "failed" ]; then
        echo "[FAIL] expected bad-fmt validate job to FAIL on fmt -check, got: ${status}"; exit 1;
      fi
      echo "[PASS] fail_on_fmt=true correctly failed the job on a mis-formatted fixture"
