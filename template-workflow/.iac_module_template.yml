"workflow":
  "rules":
    -
      "if": "$CI_COMMIT_BRANCH =~ /^(sandbox|dev|uat|main)$/ && $CI_PIPELINE_SOURCE =~ /^(push|web|schedule)$/"
      "when": "always"
    -
      "when": "never"
# Consume the team's existing release unchanged. Pipeline-owned jobs included below
# override the affected job logic/needs; no component release or source change is required.
"include":
  - component: $CI_SERVER_FQDN/kaas/pipelines/components/compliance-gates/terraform-gate@0.1.2
    inputs:
      job_name: iac_gates_job
      stage: iac_approval
      environment: $CONTROL_ENV
  - component: $CI_SERVER_FQDN/kaas/pipelines/components/compliance-gates/audit-record@0.1.2
    inputs:
      job_name: iac_audit_record
      stage: iac_audit
      environment: $CONTROL_ENV
      module: $CI_PROJECT_NAME
      apply_job: iac_apply_job
      plan_job: iac_init_job
      tf_root: control-evidence
      audit_storage_account: $AUDIT_STORAGE_ACCOUNT
  -
    "local": "/variables/.variables.yml"
  -
    "local": "/scan/gitleaks/.gitleaks.yml"
  -
    "local": "/scan/checkov/.checkov.yml"
  -
    "local": "/scan/coverity/.coverity.yml"
  -
    "local": "/scan/terrascan/.terrascan.yml"
  -
    "local": "/lint/tflint/.tflint.yml"
  -
    "local": "/iac/.iac_tf_init.yml"
  -
    "local": "/iac/.iac_gates_job.yml"
  -
    "local": "/iac/.iac_tf_apply.yml"
  -
    "local": "/iac/.iac_audit_record.yml"
  -
    "local": "/iac/.iac_destroy_plan.yml"
  -
    "local": "/iac/.iac_destroy_gate.yml"
  -
    "local": "/iac/.iac_tf_destroy.yml"
"stages":
  - "secret_detection"
  - "iac_sast"
  - "iac_terrascan"
  - "iac_coverity"
  - "lint"
  - "iac_init"
  - "iac_approval"
  - "iac_apply"
  - "iac_audit"
  - "iac_destroy_plan"
  - "iac_destroy_approval"
  - "iac_destroy"
