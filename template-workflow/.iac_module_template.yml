"workflow":
  "rules":
    -
      "if": "$CI_COMMIT_BRANCH =~ /^(sandbox|dev|uat|main)$/ && $CI_PIPELINE_SOURCE =~ /^(push|web|schedule)$/"
      "when": "always"
    -
      "when": "never"
"include":
  -
    "local": "/variables/.variables.yml"
  -
    "local": "/scan/gitleaks/.gitleaks.yml"
  -
    "local": "/scan/checkov/.checkov.yml"
  -
    "local": "/scan/coverity/.coverity.yml"
  -
    "local": "/scan/terrascan/.terrascan.yml"
  -
    "local": "/lint/tflint/.tflint.yml"
  -
    "local": "/iac/.iac_tf_init.yml"
  -
    "local": "/iac/.iac_gates_job.yml"
  -
    "local": "/iac/.iac_tf_apply.yml"
  -
    "local": "/iac/.iac_audit_record.yml"
  -
    "local": "/iac/.iac_destroy_plan.yml"
  -
    "local": "/iac/.iac_destroy_gate.yml"
  -
    "local": "/iac/.iac_tf_destroy.yml"
"stages":
  - "secret_detection"
  - "iac_sast"
  - "iac_terrascan"
  - "iac_coverity"
  - "lint"
  - "iac_init"
  - "iac_approval"
  - "iac_apply"
  - "iac_audit"
  - "iac_destroy_plan"
  - "iac_destroy_approval"
  - "iac_destroy"
