workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^main(_[A-Za-z0-9_]+)?$/'
      variables:
        DEPLOY_ENV: "prod"
    - if: '$CI_COMMIT_BRANCH =~ /^uat(_[A-Za-z0-9_]+)?$/'
      variables:
        DEPLOY_ENV: "uat"
    - if: '$CI_COMMIT_BRANCH =~ /^dev(_[A-Za-z0-9_]+)?$/'
      variables:
        DEPLOY_ENV: "dev"
    - if: '$CI_COMMIT_BRANCH =~ /^sandbox(_[A-Za-z0-9_]+)?$/'
      variables:
        DEPLOY_ENV: "sandbox"
    - if: '$CI_COMMIT_BRANCH =~ /^STR_230(_[A-Za-z0-9_]+)?$/'
      variables:
        DEPLOY_ENV: "sandbox"
    - when: never

include:
  - local: '/variables/.variables.yml'
  - local: '/scan/gitleaks/.gitleaks.yml'
  - local: '/scan/checkov/.checkov.yml'
  - local: '/scan/coverity/.coverity.yml'
  - local: '/scan/terrascan/.terrascan.yml'
  - local: '/lint/tflint/.tflint.yml'
  - local: '/iac/.audit_runtime.yml'
  - local: '/iac/.iac_tf_init.yml'
  - local: '/iac/.iac_tf_apply.yml'
  - local: '/templates/compliance-gates/terraform-gate/template.yml'
    inputs:
      job_name: iac_gates_job
      stage: iac_approval
      environment: $DEPLOY_ENV
  - local: '/iac/.iac_tf_destroy.yml'

stages:
  - secret_detection
  - iac_sast
  - iac_terrascan
  - iac_coverity
  - lint
  - iac_init
  - iac_approval
  - iac_apply
  - iac_destroy
