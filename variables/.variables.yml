# =============================================================================
# GitLab CI/CD Global Variables
# Purpose: Centralized configuration for all pipeline jobs.
#          Override any variable per project in GitLab Settings → CI/CD → Variables.
# =============================================================================

variables:

  # ---------------------------------------------------------------------------
  # Terraform
  # ---------------------------------------------------------------------------
  TERRAFORM_IMAGE: "registry.web.boeing.com/amp/docker-images/terraform/terraform-azure/ubi8minimal-azterraform/v1.9.2"
  TERRAFORM_IMAGE_VERSION: "26.04.15"
  #TERRAFORM_IMAGE: "registry.web.boeing.com/ecs-catalog/docker-images/terraform-cloud-cli/v1/azure-v2" 
  #TERRAFORM_IMAGE_VERSION: "1.5.0"
  TERRAFORM_DEBUG_ENABLE: "N"               # Set Y to enable TF_LOG=DEBUG
  TERRAFORM_VARIABLE_ENABLE: "N"            # Set Y to use branch-specific .tfvars
  TERRAFORM_DESTROY_ENABLE: "N"             # Set Y to allow terraform destroy (dangerous)
  TERRAFORM_GRAPH_ENABLE: "N"               # Set Y to generate resource dependency graph

  TFLINT_SCAN_EXAMPLES_INCLUDE: "Y"

  

  # ---------------------------------------------------------------------------
  # Azure Authentication & Backend
  # ---------------------------------------------------------------------------
  # Environment-specific variables follow the naming pattern:
  #   AZ_<branch_prefix>_SUBSCRIPTION_ID
  #   AZ_<branch_prefix>_SP_CLIENT_ID
  #   AZ_<branch_prefix>_SP_CLIENT_SECRET   (masked, protected)
  #   AZ_<branch_prefix>_TENANT_ID
  #   AZ_<branch_prefix>_ST_ACCESS_KEY      (masked, protected)
  # These MUST be set in GitLab CI/CD settings per project — never hardcode here.

  AZ_TYPE_ENVIRONMENT: "AzureUSGovernment"   # AzureCloud | AzureUSGovernment | AzureChinaCloud
  AZ_LOGIN_CSP_TYPE: "AzureUSGovernment"     # az cloud set --name value (Gov: SP + backend are usgovernment)
  AZ_TF_BACKEND_RG: ""                       # Resource group for Terraform state storage
  AZ_TF_BACKEND_SA: ""                       # Storage account for Terraform state

  # ---------------------------------------------------------------------------
  # Audit record (WORM) — STR-230
  # Implemented by consuming the official KaaS CI/CD component
  #   compliance-gates/audit-record@0.1.2  (kaas/pipelines/components)
  # included from template-workflow/.iac_module_template.yml. The component writes the
  # immutable 11-field audit record after every apply via Managed Identity (az login --identity;
  # it rejects static ARM_CLIENT_SECRET). It CONSUMES the WORM storage account by name.
  #
  # AUDIT_STORAGE_ACCOUNT: the dedicated WORM account (provisioned separately via
  # shared-services/audit, NOT by this pipeline). TEST VALUE below for STR_230 testing on the
  # sandbox state account; set the real shared-services audit account per project before merge.
  AUDIT_STORAGE_ACCOUNT: "kaastfssandbox00sa"  # STR_230 TEST value — replace with the shared-services audit account
  # DEPLOY_ENV also feeds the audit-record component's `environment` input (declared with STR-222 below).

  # ---------------------------------------------------------------------------
  # STR-222 Environment-Specific Approval Gate
  # Implemented by consuming the official KaaS CI/CD component
  #   compliance-gates/terraform-gate@0.1.2  (kaas/pipelines/components)
  # included from template-workflow/.iac_module_template.yml. The component handles all
  # gate logic (sandbox/dev auto, uat >=1 approval, prod >=2 + ServiceNow CHG, fail-closed,
  # audit trail) and takes its settings as component INPUTS (environment, chg_pattern,
  # min_approvals_*), not CI variables. It authenticates with the built-in CI_JOB_TOKEN.
  #
  # DEPLOY_ENV feeds the component's `environment` input. Set per run/project
  # (sandbox|dev|uat|prod). Left empty here; the consumer/pipeline provides it.
  DEPLOY_ENV: ""

  # ---------------------------------------------------------------------------
  # Gitleaks (SAD - Sensitive Authentication Data)
  # ---------------------------------------------------------------------------
  SADSCAN_IMAGE: "registry.web.boeing.com/ecs-catalog/docker-images/gitlab-secret-analyzer"
  SADSCAN_IMAGE_VERSION: "v0.9.0"
  SAD_SCAN_SKIP: "N"                         # Set Y to skip gitleaks scan (not recommended)

  # ---------------------------------------------------------------------------
  # Checkov (IaC Static Analysis)
  # ---------------------------------------------------------------------------
  CHECKOV_IMAGE: "registry.web.boeing.com/ecs-catalog/docker-images/checkov/v3.2"
  CHECKOV_IMAGE_VERSION: "0.9.0"
  CHECKOV_SCAN_SKIP: "N"                     # Set Y to skip Checkov scan (not recommended)

  # ---------------------------------------------------------------------------
  # TFLint (Terraform Linter)
  # ---------------------------------------------------------------------------
  TFLINT_IMAGE: "registry.web.boeing.com/ecs-catalog/docker-images/tflint/v0"
  TFLINT_IMAGE_VERSION: "1"
  TFLINT_SCAN_SKIP: "N"                      # Set Y to skip TFLint scan (not recommended)
  TFLINT_TARGET_CLOUD: "azure"               # Target cloud: azure, aws, gcp (for plugin selection)


    # ---------------------------------------------------------------------------
  # Terrascan (IaC Policy Scanner)
  # ---------------------------------------------------------------------------
  TERRASCAN_IMAGE: "registry.web.boeing.com/ecs-catalog/docker-images/terrascan/v1"
  TERRASCAN_IMAGE_VERSION: "1.0.0"
  TERRASCAN_SCAN_SKIP: "N"                   # Set Y to skip Terrascan scan (not recommended)
  TERRASCAN_TARGET_CLOUD: "azure"            # Target cloud: azure, aws, gcp (comma-separated for multiple)

  # ---------------------------------------------------------------------------
  # Infracost (FinOps Cost Estimation)
  # ---------------------------------------------------------------------------
  INFRACOST_IMAGE: "infracost/infracost"
  INFRACOST_IMAGE_VERSION: "latest"
  INFRACOST_SCAN_SKIP: "N"                   # Set Y to skip cost estimation
  INFRACOST_SCAN_DIR: ""                      # Custom scan dir (auto-detects .kaas if empty)
  INFRACOST_CURRENCY: "USD"                   # Cost display currency: USD, EUR, GBP, etc.
  # INFRACOST_API_KEY: Set as masked/protected variable in GitLab CI/CD settings

  # ---------------------------------------------------------------------------
  # Terratest (IaC Integration Testing)
  # ---------------------------------------------------------------------------
  TERRATEST_IMAGE: "golang"
  TERRATEST_IMAGE_VERSION: "1.22"
  TERRATEST_SCAN_SKIP: "N"                   # Set Y to skip integration tests
  TERRATEST_SCAN_DIR: ""                      # Custom test dir (auto-detects test/ or tests/)
  TERRATEST_TIMEOUT: "30m"                    # Max test duration (Go duration: 30m, 1h, etc.)
  TERRATEST_PARALLELISM: "1"                  # Parallel test count (1 = sequential, safer)
  # Note: Terratest needs Azure credentials — uses same AZ_<branch>_* pattern

  # ---------------------------------------------------------------------------
  # Pipeline Behavior
  # ---------------------------------------------------------------------------
  GIT_SSL_NO_VERIFY: "true"                  # Bypass SSL verification for Git operations

  # ---------------------------------------------------------------------------
  # Application Metadata (passed to Terraform as -var)
  # ---------------------------------------------------------------------------
  APP: ""                                     # Application name
  COMPONENT: ""                               # Component name
  CLASSIFICATION: ""                          # Data classification
  PREP_PLATFORM: ""                           # Target platform
  PREP_TARGET: ""                             # Deployment target
  PREP_REGION: ""                             # Deployment region

  COVERITY_IMAGE: "registry.web.boeing.com/ecs-catalog/docker-images/coverity-analysis/v2025"
  COVERITY_IMAGE_VERSION: "0"